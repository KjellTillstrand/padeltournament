name: Test and deploy

# Least privilege: every job gets a read-only token unless it opts in. Only the
# deploy job is granted write access, and only to Pages (no contents: write).
# Actions are pinned to full commit SHAs (tag in the trailing comment); a tag
# can be moved, a SHA cannot.
# Pages source: the repository owner sets Settings > Pages > Source to "GitHub
# Actions" (a one-time manual step). Automating it with actions/configure-pages
# was evaluated and rejected: changing the source needs Administration: write,
# which GITHUB_TOKEN cannot be granted.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # This job runs repository and third-party dependency code, so it must not
      # keep the token in .git/config after checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Single source of truth for the Playwright JSON report path. It lives in
      # the runner's temp dir, outside the checkout, so no committed file can be
      # mistaken for this run's results. (runner.temp is not available in
      # job-level env, hence GITHUB_ENV.)
      - name: Set coverage report path
        run: |
          echo "PW_JSON=$RUNNER_TEMP/pw-results.json" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/pw-results.json"

      # Prove the gate itself still fails closed before trusting its verdict.
      - name: Self-test requirement coverage gate
        run: node scripts/check-req-coverage.test.mjs

      # npm ci installs exactly what package-lock.json records and fails if the
      # lockfile and package.json disagree.
      - name: Install dependencies
        run: npm ci

      # Only the bundled browsers the projects use, plus their OS libraries.
      # The "Microsoft Edge" project runs the runner's installed Edge (channel
      # msedge); WebKit is unused.
      - name: Install playwright
        run: npx playwright install --with-deps chromium firefox

      # playwright.config.js starts (and stops) the static server itself and
      # fails fast if its port is already occupied, so no server steps here.
      - name: Run tests
        env:
          # JSON report consumed by the requirement coverage gate.
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.PW_JSON }}
        run: npx playwright test --reporter=html,json

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      # Release gate (R-RELEASE-GATE): fails, naming each uncovered tag, unless
      # every "Automated Test" requirement in docs/requirements-manifest.json has
      # a passing tagged test. deploy needs this job, so a red gate blocks
      # publication on every route to main. Runs even when the test step fails
      # so the uncovered requirements are still named (a missing or partial
      # report exits 2; the job is already red either way).
      - name: Require requirement coverage
        if: ${{ !cancelled() }}
        run: node scripts/check-req-coverage.mjs "$PW_JSON"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Publish only from a push to main (never from pull_request runs), after the
    # test job and its coverage gate are green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize publications so two runs' Pages deployments never race. (No
    # branch is written any more; the group keeps its historical name.)
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    # Pages deploys through GitHub's first-party artifact flow: no branch is
    # pushed, so no job holds contents: write. pages: write + id-token: write are
    # what actions/deploy-pages needs (the OIDC token proves the deployment
    # comes from this workflow run); contents: read is restated because a
    # job-level block replaces the top-level one, and checkout needs it.
    # actions: read is for the artifact check below: listing a run's artifacts
    # needs the Actions permission, not Pages.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # The github-pages environment's deployment branch policy is a second,
    # server-side check on which branches may publish: main (and, until it is
    # retired, gh-pages).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The Pages artifact name is scoped to this run attempt. On a re-run, an
    # earlier attempt's artifact may or may not remain in the run: run
    # 37643143891 (re-run of a failed deploy) kept both attempts' artifacts;
    # run 37818542522 (full re-run of a successful run) dropped attempt 1's.
    # Artifact ids do not rise across attempts, so "newest" cannot pick ours
    # either. Per-attempt names keep both deploy-pages (which selects by name
    # and refuses 0 or more than 1 match) and the identity check below
    # unambiguous whichever happens. One name feeds the upload, the check and
    # the deploy, so the three cannot drift apart.
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      # The token is not needed after checkout: the freshness fetch below reads
      # the public repository anonymously, and deploy-pages receives its token
      # as an input, not from .git/config.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # concurrency serializes deploys but does not order them: a slower older
      # run must not deploy stale content over a newer deploy, so publish only
      # if this commit is still the head of main. The fetch is unauthenticated
      # (public repo); should it ever fail, the step fails and nothing publishes.
      - name: Skip publishing if main has moved on
        id: freshness
        run: |
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping publish: $GITHUB_SHA is no longer the head of main ($head_sha); the newer run publishes instead."
          fi

      - name: Upload web/ as the Pages artifact
        id: upload
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: web

      # deploy-pages picks the run's artifact by name, not by id. Fail unless
      # exactly one artifact named $PAGES_ARTIFACT exists in this run and it is
      # the one uploaded above. The artifacts API is eventually consistent: a
      # listing made right after the upload can omit it. So the check polls,
      # up to 6 tries 5 s apart, until the uploaded id appears. Only then does
      # it judge the count. A missing id after the last try, or a second
      # artifact under this attempt's name, still fails closed. This narrows
      # the window for a swapped artifact to the moment between this check
      # and the deploy; it does not close it (accepted residual).
      - name: Verify the Pages artifact is the one just uploaded
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [ -z "$EXPECTED_ID" ]; then
            echo "::error::The upload step reported no artifact id; refusing to publish."
            exit 1
          fi
          tries=6
          ids=""
          for try in $(seq 1 "$tries"); do
            # An API error counts as "not listed yet" and is retried; the final
            # verdict below still fails closed.
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT&per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$PAGES_ARTIFACT\") | .id | tostring] | join(\" \")")" || ids="<listing failed>"
            case " $ids " in
              *" $EXPECTED_ID "*) break ;;
            esac
            if [ "$try" -lt "$tries" ]; then
              echo "Try $try/$tries: artifact $EXPECTED_ID not listed yet (saw: [$ids]); retrying in 5 s."
              sleep 5
            fi
          done
          case " $ids " in
            *" $EXPECTED_ID "*) ;;
            *)
              echo "::error::Artifact $EXPECTED_ID ($PAGES_ARTIFACT) never appeared in run $GITHUB_RUN_ID after $tries tries; last listing: [$ids]."
              exit 1
              ;;
          esac
          count="$(printf '%s' "$ids" | wc -w | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::Ambiguous: $count artifacts named $PAGES_ARTIFACT in run $GITHUB_RUN_ID: [$ids]; expected only $EXPECTED_ID."
            exit 1
          fi
          echo "Verified: $PAGES_ARTIFACT artifact $EXPECTED_ID is the only one with that name in run $GITHUB_RUN_ID."

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}