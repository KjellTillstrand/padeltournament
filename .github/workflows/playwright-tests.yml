name: Deploy and 

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Single source of truth for the Playwright JSON report path. It lives in
      # the runner's temp dir, outside the checkout, so no committed file can be
      # mistaken for this run's results. (runner.temp is not available in
      # job-level env, hence GITHUB_ENV.)
      - name: Set coverage report path
        run: |
          echo "PW_JSON=$RUNNER_TEMP/pw-results.json" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/pw-results.json"

      # Prove the gate itself still fails closed before trusting its verdict.
      - name: Self-test requirement coverage gate
        run: node scripts/check-req-coverage.test.mjs

      - name: Install dependencies
        run: npm install

      - name: Install playwright
        run: npx playwright install

      # playwright.config.js starts (and stops) the static server itself and
      # fails fast if its port is already occupied, so no server steps here.
      - name: Run tests
        env:
          # JSON report consumed by the requirement coverage gate.
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.PW_JSON }}
        run: npx playwright test --reporter=html,json

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      # Release gate (R-RELEASE-GATE): fails, naming each uncovered tag, unless
      # every "Automated Test" requirement in docs/requirements-manifest.json has
      # a passing tagged test. deploy needs this job, so a red gate blocks
      # publication on every route to main. Runs even when the test step fails
      # so the uncovered requirements are still named (a missing or partial
      # report exits 2; the job is already red either way).
      - name: Require requirement coverage
        if: ${{ !cancelled() }}
        run: node scripts/check-req-coverage.mjs "$PW_JSON"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Publish only from a push to main (never from pull_request runs), after the
    # test job and its coverage gate are green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize publications so two runs can never race writing gh-pages.
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish current workdir (which contains generated content) to GitHub Pages
        uses: rayluo/github-pages-overwriter@v1.3

        with:

          # Optional.
          #
          # Default value "." means the root directory of your project will be published.
          #
          # You can use whatever directory your project uses,
          # for example "wwwroot" (without leading "./").
          # Such a directory does *not* have to already exist in your repo,
          # it could be an output directory created dynamically
          # by your static website builder.
          source-directory: web

          # Optional. Default value "gh-pages".
          # It specifies the temporary branch which hosts the static website.
          # Each build will REMOVE this branch and replace it with new content.
          # (If you want to keep your old "gh-pages" branch,
          # you should define a different target branch for this GPO action to work with.)
          target-branch: gh-pages