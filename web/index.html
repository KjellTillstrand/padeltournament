<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Padel Turrar Tournament Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Players resting this round (counts that are not a multiple of 4);
       styled like the scoreboard panel. */
    .resting-players {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 20px;
    }
    .resting-players .resting-label {
      font-weight: bold;
      margin-right: 0.5em;
    }
    .resting-players .resting-player + .resting-player::before {
      content: ", ";
    }
    /* Mexicano: what the next round is waiting for, and the rounds it locked. */
    .round-status {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin: 0 0 10px 0;
    }
    .match.score-missing .court {
      outline: 4px dashed #ff8c00;
      outline-offset: 2px;
    }
    .round-header .center button:disabled {
      background-color: #8a9a8a;
      cursor: not-allowed;
    }
  </style>
  <!-- Multiples of 4: perfect-whist tables (scheduler/whist-generate.js).
       Other counts: rest-round tables (scheduler/engine/sitout-generate.mjs). -->
  <script src="schedules/8p7r.js"></script>
  <script src="schedules/9p9r.js"></script>
  <script src="schedules/10p10r.js"></script>
  <script src="schedules/11p11r.js"></script>
  <script src="schedules/12p11r.js"></script>
  <script src="schedules/13p13r.js"></script>
  <script src="schedules/14p14r.js"></script>
  <script src="schedules/15p15r.js"></script>
  <script src="schedules/16p15r.js"></script>
  <script src="schedules/17p17r.js"></script>
  <script src="schedules/18p18r.js"></script>
  <script src="schedules/19p19r.js"></script>
  <script src="schedules/20p19r.js"></script>
  <script src="schedules/21p21r.js"></script>
  <script src="schedules/22p22r.js"></script>
  <script src="schedules/23p23r.js"></script>
  <script src="schedules/24p23r.js"></script>
  <!-- Mexicano pairing (window.Mexicano): generates each Mexicano round from the standings. -->
  <script src="mexicano.js"></script>
</head>

<body>
  <!-- Header: Tournament Title and Site Name -->
  <div id="header" class="header-with-logo">
    <img id="siteLogo" src="" alt="Site Logo" />
    <div class="header-text">
      <h1 id="tournamentTitle">Tournament Title</h1>
      <p id="siteName">Powered by Padel Turrar</p>
    </div>
  </div>


  <div id="settingsContainer">
    <div class="global-controls">
      <label for="formatSelect">Format:</label>
      <select id="formatSelect">
        <option value="americano" selected>Americano</option>
        <option value="mexicano">Mexicano</option>
      </select>
      <!-- Mexicano: the Organizer picks a player count; rounds are generated during play. -->
      <label for="playerCountSelect" id="playerCountLabel" style="display:none;">Players:</label>
      <select id="playerCountSelect" style="display:none;">
        <!-- Options (MIN_MEXICANO_PLAYERS..MAX_MEXICANO_PLAYERS) are generated below. -->
      </select>
      <label for="scheduleSelect" id="scheduleSelectLabel">Select Schedule:</label>
      <!-- Each value <N>p<R>r.js names the module that sets window.schedule<N>p<R>r
           (see loadScheduleFromModule); every option needs its script tag above. -->
      <select id="scheduleSelect">
        <option value="8p7r.js">8 Player, 7 Round Schedule</option>
        <option value="9p9r.js">9 Player, 9 Round Schedule</option>
        <option value="10p10r.js">10 Player, 10 Round Schedule</option>
        <option value="11p11r.js">11 Player, 11 Round Schedule</option>
        <option value="12p11r.js" selected>12 Player, 11 Round Schedule</option>
        <option value="13p13r.js">13 Player, 13 Round Schedule</option>
        <option value="14p14r.js">14 Player, 14 Round Schedule</option>
        <option value="15p15r.js">15 Player, 15 Round Schedule</option>
        <option value="16p15r.js">16 Player, 15 Round Schedule</option>
        <option value="17p17r.js">17 Player, 17 Round Schedule</option>
        <option value="18p18r.js">18 Player, 18 Round Schedule</option>
        <option value="19p19r.js">19 Player, 19 Round Schedule</option>
        <option value="20p19r.js">20 Player, 19 Round Schedule</option>
        <option value="21p21r.js">21 Player, 21 Round Schedule</option>
        <option value="22p22r.js">22 Player, 22 Round Schedule</option>
        <option value="23p23r.js">23 Player, 23 Round Schedule</option>
        <option value="24p23r.js">24 Player, 23 Round Schedule</option>
      </select>
      <label for="globalTotalPoints">Global Total Points:</label>
      <select id="globalTotalPoints">
        <option value="16">16</option>
        <option value="21">21</option>
        <option value="24" selected>24</option>
        <option value="32">32</option>
      </select>
    </div>


    <div class="tournament-info">
      <label for="tournamentName">Tournament Name:</label>
      <input type="text" id="tournamentName" placeholder="Enter tournament name" maxlength="200" />
    </div>

    <!-- Move Start Tournament Button Below -->
    <div class="start-button-container">
      <button id="startTournamentBtn">Start Tournament</button>
    </div>

    <div id="playerInputsContainer">
      <!-- Player input fields will be generated here -->
    </div>

    <div class="court-names-section">
      <label>Court Names:</label>
      <div id="courtNamesContainer">
        <!-- Court name input fields (one per court) will be generated here -->
      </div>
    </div>

    <!-- New container to properly space the saved tournaments section -->
    <div class="saved-tournaments-container">
      <label for="savedTournamentSelect">Saved Tournaments:</label>
      <select id="savedTournamentSelect"></select>
      <button id="loadTournamentBtn">Load Tournament</button>
      <button id="deleteTournamentBtn">Delete Tournament</button>
    </div>

  </div>
  <button id="toggleSettingsBtn" style="display:none;">Tournament Settings</button>

  <!-- Tournament container: displays one round at a time -->
  <div id="tournamentContainer" class="schedule-container"></div>

  <script>
    let currentSchedule = null;
    let defaultPlayerNames = []; // stores original names from schedule load
    let tournamentStarted = false;
    let currentRoundIndex = 0; // 0-indexed
    let courtNames = []; // custom court names, index 0 = court 1; empty = use the default name

    // Tournament format. Americano plays a precomputed schedule. Mexicano is set up by
    // player count and played one round at a time: round 1 is a seeded random draw,
    // every later round is generated (web/mexicano.js) from the standings once the
    // current round is complete. currentSchedule.rounds is then the list of rounds
    // generated so far; every round but the latest has seeded a later one, so its
    // scores are locked (derived, never stored: see isRoundLocked).
    const FORMATS = ["americano", "mexicano"];
    const DEFAULT_FORMAT = "americano";
    const MIN_MEXICANO_PLAYERS = 8;
    const MAX_MEXICANO_PLAYERS = 24;
    const DEFAULT_MEXICANO_PLAYERS = 12;
    const MAX_MEXICANO_SEED = 0xFFFFFFFF; // the round-1 draw's seed is an unsigned 32-bit integer
    let tournamentFormat = DEFAULT_FORMAT;
    let mexicanoPlayerCount = DEFAULT_MEXICANO_PLAYERS;
    let mexicanoSeed = null; // drawn once when a Mexicano tournament starts; null otherwise

    // Points total: the two scores of every match sum to it. It belongs to the
    // tournament (persisted with it), and #globalTotalPoints only displays and sets it.
    const POINT_POOLS = [16, 21, 24, 32]; // the #globalTotalPoints options
    const DEFAULT_TOTAL_POINTS = 24;
    let totalPoints = DEFAULT_TOTAL_POINTS;

    // Limits for anything read back from localStorage (see "Persisted-state validation").
    // Each is at least as loose as what the app itself can write.
    const MAX_PLAYER_NAME_LENGTH = 30; // the player name inputs' maxLength (start allows 20)
    const MAX_COURT_NAME_LENGTH = 30; // the court name inputs' maxLength
    const MAX_PLAYERS = 64; // shipped schedules have 8-24 (any count)
    const MAX_ROUNDS = 128; // shipped schedules have 7-23

    // Update header when tournament name changes.
    document.getElementById("tournamentName").addEventListener("input", function () {
      document.getElementById("tournamentTitle").textContent = this.value || "Tournament Title";
    });

    // Save tournament state to localStorage.
    function saveTournamentState() {
      const state = {
        schedule: currentSchedule,
        currentRoundIndex: currentRoundIndex,
        tournamentStarted: tournamentStarted,
        tournamentName: document.getElementById("tournamentName").value,
        courtNames: courtNames.slice(),
        format: tournamentFormat,
        mexicanoPlayerCount: mexicanoPlayerCount,
        mexicanoSeed: mexicanoSeed,
        totalPoints: totalPoints
      };
      writeStoredJson("tournamentState", state);
    }

    // Store a value as JSON. A failed write (storage full or unavailable, a value
    // that cannot be serialized) is logged and reported as false; it never aborts
    // the action that triggered it.
    function writeStoredJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (err) {
        console.warn("Could not write localStorage value:", key, err);
        return false;
      }
    }

    // Restore the saved tournament state into memory. Returns false (and drops the
    // stored value) when there is none or it is unusable; the caller then starts
    // from the default schedule. Rendering is left to the caller.
    function restoreTournamentState() {
      const state = readTournamentState();
      if (!state) {
        if (localStorage.getItem("tournamentState") !== null) {
          console.warn("Ignoring an unusable saved tournament state; starting a fresh setup.");
          localStorage.removeItem("tournamentState");
        }
        return false;
      }
      currentSchedule = state.schedule;
      currentRoundIndex = state.currentRoundIndex;
      tournamentStarted = state.tournamentStarted;
      // A setup that has not started still holds its schedule's own player names
      // (names are assigned at Start), and its module is not loaded again: they
      // are the defaults a blank name input falls back to, whatever the format.
      if (!tournamentStarted) storeDefaultPlayerNames(currentSchedule.players);
      courtNames = state.courtNames;
      tournamentFormat = state.format;
      mexicanoPlayerCount = state.mexicanoPlayerCount;
      mexicanoSeed = state.mexicanoSeed;
      totalPoints = state.totalPoints;
      document.getElementById("tournamentName").value = state.tournamentName;
      document.getElementById("tournamentTitle").textContent = state.tournamentName || "Tournament Title";
      return true;
    }

    // Discard whatever is in memory and show the setup for a new tournament.
    function startFreshSetup() {
      courtNames = [];
      tournamentFormat = DEFAULT_FORMAT;
      mexicanoPlayerCount = DEFAULT_MEXICANO_PLAYERS;
      mexicanoSeed = null;
      totalPoints = DEFAULT_TOTAL_POINTS;
      document.getElementById("tournamentName").value = "";
      document.getElementById("tournamentTitle").textContent = "Tournament Title";
      resetTournamentState(); // also drops the stored state and loads the default schedule
      document.getElementById("settingsContainer").style.display = "block";
    }


    // Restore tournament state from localStorage.
    window.addEventListener("load", function () {
      try {
        showInitialView();
      } catch (err) {
        // Last line of defence: stored state is validated before use, but whatever
        // slips through must never leave a broken page.
        console.error("Could not restore the saved tournament; starting a fresh setup.", err);
        startFreshSetup();
      }

      // Populate the saved tournament dropdown.
      populateSavedTournamentDropdown();
    });

    function showInitialView() {
      // 1. Restore a saved state; 2. without a usable one, load the default schedule.
      if (!restoreTournamentState()) {
        const defaultModule = document.getElementById("scheduleSelect").value;
        loadScheduleFromModule(defaultModule);
      }

      // 3. Ensure currentSchedule is loaded.
      if (!currentSchedule) {
        const defaultModule = document.getElementById("scheduleSelect").value;
        loadScheduleFromModule(defaultModule);
      }

      // 4. Generate the player name table and the court name inputs.
      if (currentSchedule && currentSchedule.players) {
        renderSetupInputs();
      } else {
        console.error("No schedule loaded; please load a schedule first.");
      }

      // 5. Show the setup controls of the active format (restored or the default).
      applyFormatUI();

      // 6. Show either the tournament round (if running) or the settings for new tournament.
      if (tournamentStarted) {
        disableSettings();
        document.getElementById("toggleSettingsBtn").style.display = "block";
        displayRound(currentRoundIndex);
      } else {
        document.getElementById("settingsContainer").style.display = "block";
        document.getElementById("toggleSettingsBtn").style.display = "none";
      }
    }




    // Save current tournament.
    // Returns whether the tournament was stored.
    function saveTournament() {
      if (!currentSchedule) return false;
      const tournamentName = document.getElementById("tournamentName").value.trim() || "Unnamed Tournament";
      const savedTournament = {
        tournamentName: tournamentName,
        schedule: currentSchedule,
        currentRoundIndex: currentRoundIndex,
        courtNames: courtNames.slice(),
        format: tournamentFormat,
        mexicanoSeed: mexicanoSeed,
        totalPoints: totalPoints,
        savedAt: new Date().toISOString()
      };
      let savedTournaments = readSavedTournaments();
      const existingIndex = savedTournaments.findIndex(t => t.tournamentName === tournamentName);
      if (existingIndex !== -1) {
        savedTournaments[existingIndex] = savedTournament;
      } else {
        savedTournaments.push(savedTournament);
      }
      const saved = writeStoredJson("savedTournaments", savedTournaments);
      populateSavedTournamentDropdown();
      alert(saved ? "Tournament saved!" : "The tournament could not be saved.");
      return saved;
    }

    // Load tournament.
    function loadTournament() {
      let savedTournaments = readSavedTournaments();
      const dropdown = document.getElementById("savedTournamentSelect");
      const selectedIndex = parseInt(dropdown.value, 10);
      if (!isNaN(selectedIndex) && savedTournaments[selectedIndex]) {
        const selectedTournament = savedTournaments[selectedIndex];
        currentSchedule = selectedTournament.schedule;
        // Tournaments saved before round position was tracked (or with a corrupted
        // index) carry none/an invalid value: fall back to round 0.
        currentRoundIndex = normalizeRoundIndex(selectedTournament.currentRoundIndex, currentSchedule);
        tournamentStarted = true;
        // Tournaments saved before court names existed carry none: use the defaults.
        courtNames = normalizeCourtNames(selectedTournament.courtNames);
        generateCourtNameInputs();
        // Tournaments saved before formats existed carry none: they are Americano.
        tournamentFormat = selectedTournament.format;
        mexicanoSeed = selectedTournament.mexicanoSeed;
        if (tournamentFormat === "mexicano") {
          // The settings show the loaded tournament's players (locked below).
          mexicanoPlayerCount = currentSchedule.players.length;
          generatePlayerInputs(currentSchedule.players);
        }
        // Tournaments saved before the points total was stored carry none: it is
        // inferred from their results (storedTotalPoints), else 24.
        totalPoints = selectedTournament.totalPoints;
        applyFormatUI();
        document.getElementById("tournamentName").value = selectedTournament.tournamentName;
        document.getElementById("tournamentTitle").textContent = selectedTournament.tournamentName;
        disableSettings();
        document.getElementById("toggleSettingsBtn").style.display = "block";
        displayRound(currentRoundIndex);
        saveTournamentState();
      }
    }

    // Delete tournament.
    function deleteTournament() {
      const tournamentName = document.getElementById("tournamentName").value.trim();
      if (!tournamentName) {
        alert("No tournament name provided.");
        return;
      }
      if (confirm(`Are you sure you want to delete "${tournamentName}"? Your secret sauce will vanish forever!`)) {
        let savedTournaments = readSavedTournaments();
        savedTournaments = savedTournaments.filter(t => t.tournamentName !== tournamentName);
        writeStoredJson("savedTournaments", savedTournaments);
        populateSavedTournamentDropdown();
        resetTournamentState();
        alert(`Tournament "${tournamentName}" deleted!`);
      }
    }

    function getUniqueTournamentName(baseName) {
      let savedTournaments = readSavedTournaments();
      let usedNames = new Set(savedTournaments.map(t => t.tournamentName));
      if (!usedNames.has(baseName)) return baseName;

      let i = 1;
      let newName = `${baseName}-${i}`;
      while (usedNames.has(newName)) {
        i++;
        newName = `${baseName}-${i}`;
      }
      return newName;
    }



    document.getElementById("startTournamentBtn").addEventListener("click", function () {
      // Start is disabled while a tournament runs; a re-enabled button (as with
      // devtools) must not replace the running tournament and its locked rounds.
      if (tournamentStarted) return;

      // Get and trim tournament name.
      let tournamentName = document.getElementById("tournamentName").value.trim();
      if (!tournamentName) {
        alert("Tournament name must not be empty.");
        console.log("Start tournament aborted: name is empty.");
        return; // Exit function if name is empty.
      }

      // Generate unique tournament name and update input.
      tournamentName = getUniqueTournamentName(tournamentName);
      document.getElementById("tournamentName").value = tournamentName;

      if (tournamentFormat === "mexicano") {
        if (!startMexicano()) return;
      } else {
        if (!currentSchedule) {
          alert("Please load a schedule first.");
          return;
        }

        if (!randomizePlayers()) return;
      }

      // Now proceed to start the tournament.
      tournamentStarted = true;
      currentRoundIndex = 0;
      disableSettings();
      document.getElementById("settingsContainer").style.display = "none";
      document.getElementById("toggleSettingsBtn").style.display = "block";
      displayRound(currentRoundIndex);
      saveTournamentState();
    });

    // New tournament.
    function newTournament() {
      if (confirm("Do you want to save the current tournament before creating a new one?")) {
        // The Organizer asked to keep it: if it could not be stored, do not discard it.
        if (!saveTournament()) {
          alert("The current tournament was kept, because it could not be saved.");
          return;
        }
      }
      // Clear the name first: resetTournamentState saves the new, empty setup.
      document.getElementById("tournamentName").value = "";
      document.getElementById("tournamentTitle").textContent = "Tournament Title";
      resetTournamentState();
      document.getElementById("settingsContainer").style.display = "block";
      alert("Ready for a new tournament!");
    }


    function resetTournamentState() {
      tournamentStarted = false;
      currentSchedule = null;
      currentRoundIndex = 0;
      mexicanoSeed = null;
      document.getElementById("formatSelect").disabled = false;
      document.getElementById("playerCountSelect").disabled = false;
      document.getElementById("scheduleSelect").disabled = false;
      document.getElementById("globalTotalPoints").disabled = false;
      document.getElementById("tournamentName").disabled = false;
      const inputs = document.querySelectorAll("#playerInputsContainer input, #playerInputsContainer textarea");
      inputs.forEach(input => input.disabled = false);
      document.getElementById("startTournamentBtn").disabled = false;
      document.getElementById("toggleSettingsBtn").style.display = "none";
      localStorage.removeItem("tournamentState");
      loadScheduleFromModule(document.getElementById("scheduleSelect").value);
      clearPlayerNameDrafts(); // a new setup starts from the default names
      renderSetupInputs(); // the chosen format is kept, with its player count
      applyFormatUI();
      saveTournamentState(); // persist the kept format now, not only on unload
    }

    function populateSavedTournamentDropdown() {
      const dropdown = document.getElementById("savedTournamentSelect");
      let savedTournaments = readSavedTournaments();
      dropdown.innerHTML = "";
      savedTournaments.forEach((tournament, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = tournament.tournamentName + " (Saved: " + formatSavedAt(tournament.savedAt) + ")";
        dropdown.appendChild(option);
      });
      if (currentSchedule && document.getElementById("tournamentName").value) {
        const currentName = document.getElementById("tournamentName").value.trim();
        const selectedIndex = savedTournaments.findIndex(t => t.tournamentName === currentName);
        if (selectedIndex !== -1) dropdown.value = selectedIndex;
      }
    }

    // --- Helper Functions (no duplicates) ---
    function storeDefaultPlayerNames(players) {
      defaultPlayerNames = players.slice();
    }

    function generatePlayerInputs(players) {
      const container = document.getElementById("playerInputsContainer");
      container.innerHTML = ""; // Clear previous content

      // Create the table container
      const table = document.createElement("div");
      table.className = "player-names-table";

      players.forEach((player, index) => {
        const input = document.createElement("input");
        input.type = "text";
        input.value = player;
        input.maxLength = 30; // Ensures a max of 30 characters
        input.id = "playerInput_" + index;
        input.placeholder = "Enter name";

        table.appendChild(input); // Add each input directly to the table grid
      });

      container.appendChild(table); // Append table to the container
    }

    // --- Persisted-state validation ---
    // localStorage is shared by every page on this origin, including the other
    // GitHub Pages projects served from it, so everything read back is untrusted:
    // it is parsed defensively, shape-checked, and REBUILT from only the checked
    // fields, so nothing unchecked (extra properties, deep nesting) ever reaches the
    // app or is written back by it. A schedule whose structure is unusable is
    // rejected whole (a stored tournamentState then falls back to a fresh setup; a
    // saved tournament is skipped); fields that can be repaired (round index,
    // names, scores) are reset to their defaults. The checks are never stricter than
    // what the app itself writes, so the app's own data always survives a reload.

    function isPlainObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    // The parsed value of a localStorage key, or null when missing or unparsable.
    function readStoredJson(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      try {
        return JSON.parse(raw);
      } catch (err) {
        console.warn("Ignoring unparsable localStorage value:", key);
        return null;
      }
    }

    // Player names are rendered as text only, so any string the name inputs can
    // produce is acceptable; it just has to be a non-blank string of bounded length.
    function isValidPlayerName(name) {
      return typeof name === "string" && name.length <= MAX_PLAYER_NAME_LENGTH && name.trim() !== "";
    }

    // Tournament names are rendered as text only; anything but a string means "no name".
    function normalizeTournamentName(name) {
      return typeof name === "string" ? name : "";
    }

    // Only a known format is kept; anything else (state saved before formats existed,
    // hostile values) means Americano, the format every older tournament was played in.
    function normalizeFormat(format) {
      return typeof format === "string" && FORMATS.includes(format) ? format : DEFAULT_FORMAT;
    }

    // The Mexicano player count is an integer in the range the setup offers, else the default.
    function normalizeMexicanoPlayerCount(count) {
      return Number.isInteger(count) && count >= MIN_MEXICANO_PLAYERS && count <= MAX_MEXICANO_PLAYERS
        ? count : DEFAULT_MEXICANO_PLAYERS;
    }

    // Only one of the offered point pools is kept, as the number the app writes;
    // anything else (state saved before the total was stored, hostile values)
    // means 24, the default every older tournament was played to.
    function normalizeTotalPoints(total) {
      return Number.isInteger(total) && POINT_POOLS.includes(total) ? total : DEFAULT_TOTAL_POINTS;
    }

    // The points total of a stored tournament state or saved tournament, read
    // before its results are checked against it. A stored total (even an
    // invalid one) is normalized. Only a legacy record, saved before the total
    // was stored (no totalPoints key at all), has it inferred from its results:
    // every complete stored pair (both sides plain digits) must sum to the same
    // value, and that value must be a pool. Otherwise it is 24.
    function storedTotalPoints(record) {
      if (Object.prototype.hasOwnProperty.call(record, "totalPoints")) return normalizeTotalPoints(record.totalPoints);
      const sums = new Set();
      const rounds = isPlainObject(record.schedule) && Array.isArray(record.schedule.rounds) ? record.schedule.rounds : [];
      rounds.forEach(round => {
        if (!isPlainObject(round) || !Array.isArray(round.matches)) return;
        round.matches.forEach(match => {
          const result = isPlainObject(match) ? match.result : null;
          if (!isPlainObject(result) || typeof result.left !== "string" || typeof result.right !== "string") return;
          if (!/^\d+$/.test(result.left) || !/^\d+$/.test(result.right)) return;
          sums.add(Number(result.left) + Number(result.right));
        });
      });
      const [sum] = sums;
      return sums.size === 1 ? normalizeTotalPoints(sum) : DEFAULT_TOTAL_POINTS;
    }

    // Two teams of two, each entry an integer index into the player list.
    // Returns a copy, or null when the shape is wrong.
    function copyTeamIndices(teamIndices, playerCount) {
      const valid = Array.isArray(teamIndices) && teamIndices.length === 2 && teamIndices.every(team =>
        Array.isArray(team) && team.length === 2 &&
        team.every(i => Number.isInteger(i) && i >= 0 && i < playerCount));
      return valid ? teamIndices.map(team => team.slice()) : null;
    }

    // The one score rule, shared by score entry, its validation, the "round
    // complete" check, the scoreboard and restored results: a score is a whole
    // number from 0 to the points total, written as plain digits (no sign,
    // fraction, exponent or spaces). Returns it, or null for anything else,
    // including no entry ("").
    function parseScore(value, total) {
      requirePointPool(total);
      if (typeof value !== "string" || !/^\d+$/.test(value)) return null;
      const score = Number(value);
      return score <= total ? score : null;
    }

    // The score rule is always applied against an explicit pool. A caller that
    // passes none (or a raw stored value) is a bug: fail loudly rather than
    // judge every score invalid and blank the results.
    function requirePointPool(total) {
      if (!POINT_POOLS.includes(total)) throw new Error("Score check without a valid points total: " + String(total));
    }

    // A complete, valid result: two scores (see parseScore) that sum to the total.
    function isCompleteResult(result, total) {
      requirePointPool(total);
      if (!result) return false;
      const left = parseScore(result.left, total);
      const right = parseScore(result.right, total);
      return left !== null && right !== null && left + right === total;
    }

    // The result a match records for the entered scores: as entered when complete
    // and valid, otherwise "no score yet" (both ""). So a recorded result is
    // always one of the two, whether written by score entry or restored.
    function recordedResult(left, right, total) {
      const result = { left: left, right: right };
      return isCompleteResult(result, total) ? result : { left: "", right: "" };
    }

    // Scores are the raw values of the score inputs: strings ("" when not entered).
    // A result of the wrong shape is repaired to "no result recorded"; a pair that
    // breaks the score rule for the tournament's total (out of range, fractional,
    // not summing to the total, one side only) to "no score yet", so the match
    // can be scored again (unless it is in a locked Mexicano round, which stays
    // read-only; only tampered storage can put an invalid pair there).
    function copyResult(result, total) {
      requirePointPool(total);
      if (!isPlainObject(result) || typeof result.left !== "string" || typeof result.right !== "string") return null;
      return recordedResult(result.left, result.right, total);
    }

    // A rebuilt match, or null when its structure is unusable.
    function copyMatch(match, players, courtCount, requireTeamIndices, total) {
      if (!isPlainObject(match)) return null;
      // The court number becomes a CSS class and a data attribute: an in-range integer only.
      if (!Number.isInteger(match.court) || match.court < 1 || match.court > courtCount) return null;
      if (!Array.isArray(match.teams) || match.teams.length !== 2) return null;
      const teamsValid = match.teams.every(team =>
        Array.isArray(team) && team.length === 2 &&
        team.every(player => typeof player === "string" && players.has(player)));
      if (!teamsValid) return null;
      const copy = {
        court: match.court,
        teams: match.teams.map(team => team.slice()),
        result: copyResult(match.result, total)
      };
      // teamIndices maps players to schedule slots when names are assigned at start:
      // a tournament that has not started yet cannot do without it; a started one
      // never uses it again, so a bad one is simply dropped.
      const teamIndices = copyTeamIndices(match.teamIndices, players.size);
      if (teamIndices) copy.teamIndices = teamIndices;
      else if (requireTeamIndices) return null;
      return copy;
    }

    // A copy of the schedule holding only the fields the rounds, scoreboard and start
    // flow read, each of the right type and in range; null when it is unusable.
    // Byes (who rests) are never read from storage: they are rebuilt from the
    // checked matches (setByes), so they always name exactly the unseated players.
    // Results are checked against total, the tournament's (normalized) points total.
    function copySchedule(schedule, requireTeamIndices, total) {
      if (!isPlainObject(schedule)) return null;
      const playerList = schedule.players;
      // At least one full court; with a count that is not a multiple of four the
      // players left over rest each round.
      if (!Array.isArray(playerList) || playerList.length < 4 || playerList.length > MAX_PLAYERS) return null;
      if (!playerList.every(isValidPlayerName)) return null;
      const players = new Set(playerList);
      if (players.size !== playerList.length) return null; // names must be unique
      const courtCount = Math.floor(playerList.length / 4);
      const rounds = schedule.rounds;
      if (!Array.isArray(rounds) || rounds.length < 1 || rounds.length > MAX_ROUNDS) return null;
      const roundCopies = [];
      for (const round of rounds) {
        if (!isPlainObject(round) || !Number.isInteger(round.roundNumber) ||
          round.roundNumber < 1 || round.roundNumber > MAX_ROUNDS) return null;
        if (!Array.isArray(round.matches) || round.matches.length < 1 || round.matches.length > courtCount) return null;
        const matchCopies = round.matches.map(match => copyMatch(match, players, courtCount, requireTeamIndices, total));
        if (matchCopies.includes(null)) return null;
        roundCopies.push({ roundNumber: round.roundNumber, matches: matchCopies });
      }
      return setByes({ players: playerList.slice(), rounds: roundCopies });
    }

    // The players a round seats on no court, in player-list order: who rests.
    function restingPlayers(players, matches) {
      const seated = new Set();
      matches.forEach(match => match.teams.forEach(team => team.forEach(player => seated.add(player))));
      return players.filter(player => !seated.has(player));
    }

    // Set each round's byes from its matches, as the shipped tables carry them:
    // only a player count that is not a multiple of four has byes. Called
    // wherever a schedule is loaded, restored or renamed. Returns the schedule.
    function setByes(schedule) {
      const withByes = schedule.players.length % 4 !== 0;
      schedule.rounds.forEach(round => {
        if (withByes) round.byes = restingPlayers(schedule.players, round.matches);
        else delete round.byes;
      });
      return schedule;
    }

    // The seed of a Mexicano round-1 draw: an unsigned 32-bit integer, as the app draws it.
    function isValidMexicanoSeed(seed) {
      return Number.isInteger(seed) && seed >= 0 && seed <= MAX_MEXICANO_SEED;
    }

    // A copy of a started Mexicano tournament's schedule, or null when it is unusable.
    // On top of copySchedule's checks it must be structurally sound, the shape the
    // next round can be generated from: a player count Mexicano pairs (8-24), rounds
    // numbered 1, 2, 3, ... in order, and in every round each court used exactly once
    // and each player seated at most once (the rest are its byes). This is a shape
    // check only: it does not prove the app generated these rounds.
    function copyMexicanoSchedule(schedule, total) {
      const copy = copySchedule(schedule, false, total);
      if (!copy) return null;
      const playerCount = copy.players.length;
      if (playerCount < MIN_MEXICANO_PLAYERS || playerCount > MAX_MEXICANO_PLAYERS) return null;
      const courtCount = Math.floor(playerCount / 4);
      const sound = copy.rounds.every((round, index) => {
        if (round.roundNumber !== index + 1 || round.matches.length !== courtCount) return false;
        const courts = new Set(round.matches.map(match => match.court));
        const seated = new Set(round.matches.flatMap(match => match.teams.flat()));
        return courts.size === courtCount && seated.size === courtCount * 4;
      });
      return sound ? copy : null;
    }

    // The schedule and seed of a started tournament in the given (normalized) format,
    // or null when they are unusable. A Mexicano tournament needs a structurally sound
    // Mexicano schedule and a well-formed seed for its round-1 draw (the app writes
    // both at Start); without them it is not used to generate further rounds. The
    // seed is shape-checked only: it is not authenticated, and round 1 is not
    // re-derived from it.
    function copyStartedPlay(format, schedule, seed, total) {
      if (format !== "mexicano") {
        const copy = copySchedule(schedule, false, total);
        return copy ? { schedule: copy, mexicanoSeed: null } : null;
      }
      if (!isValidMexicanoSeed(seed)) return null;
      const copy = copyMexicanoSchedule(schedule, total);
      return copy ? { schedule: copy, mexicanoSeed: seed } : null;
    }

    // A rebuilt copy of the stored tournamentState, or null when it is missing or
    // unusable.
    function readTournamentState() {
      const state = readStoredJson("tournamentState");
      if (!isPlainObject(state)) return null;
      const started = state.tournamentStarted === true;
      const format = normalizeFormat(state.format);
      // Read first: stored results are checked against it.
      const total = storedTotalPoints(state);
      // A setup that has not started holds the Americano schedule (whatever the
      // format) and no seed: the seed is drawn at Start.
      const play = started
        ? copyStartedPlay(format, state.schedule, state.mexicanoSeed, total)
        : { schedule: copySchedule(state.schedule, true, total), mexicanoSeed: null };
      if (!play || !play.schedule) return null;
      const schedule = play.schedule;
      return {
        schedule: schedule,
        currentRoundIndex: normalizeRoundIndex(state.currentRoundIndex, schedule),
        tournamentStarted: started,
        tournamentName: normalizeTournamentName(state.tournamentName),
        courtNames: normalizeCourtNames(state.courtNames),
        format: format,
        // A running Mexicano tournament's count is its players'; a setup's is the chosen one.
        mexicanoPlayerCount: started && format === "mexicano"
          ? schedule.players.length : normalizeMexicanoPlayerCount(state.mexicanoPlayerCount),
        mexicanoSeed: play.mexicanoSeed,
        totalPoints: total
      };
    }

    // A rebuilt saved tournament, or null when it has no usable name (the save's
    // key) or schedule. Loaded tournaments are always started, so teamIndices is
    // not required.
    function copySavedTournament(entry) {
      if (!isPlainObject(entry) || typeof entry.tournamentName !== "string" || entry.tournamentName.trim() === "") return null;
      const format = normalizeFormat(entry.format); // saved tournaments are always started
      const total = storedTotalPoints(entry); // stored results are checked against it
      const play = copyStartedPlay(format, entry.schedule, entry.mexicanoSeed, total);
      if (!play) return null;
      const schedule = play.schedule;
      const copy = {
        tournamentName: entry.tournamentName,
        schedule: schedule,
        currentRoundIndex: normalizeRoundIndex(entry.currentRoundIndex, schedule),
        courtNames: normalizeCourtNames(entry.courtNames),
        format: format,
        mexicanoSeed: play.mexicanoSeed,
        totalPoints: total
      };
      if (typeof entry.savedAt === "string") copy.savedAt = entry.savedAt;
      return copy;
    }

    // The usable saved tournaments, rebuilt; unusable entries are skipped (and
    // dropped from storage the next time the list is written).
    function readSavedTournaments() {
      const saved = readStoredJson("savedTournaments");
      if (!Array.isArray(saved)) return [];
      return saved.map(copySavedTournament).filter(entry => entry !== null);
    }

    function formatSavedAt(savedAt) {
      if (typeof savedAt !== "string") return "unknown";
      const date = new Date(savedAt);
      return isNaN(date.getTime()) ? "unknown" : date.toLocaleString();
    }

    // --- Court Names ---
    // Keep only strings, cut to the inputs' maxLength; anything else (missing state,
    // legacy saves, hostile values) means "use the default".
    function normalizeCourtNames(names) {
      if (!Array.isArray(names)) return [];
      return names.slice(0, MAX_PLAYERS / 4).map(name =>
        (typeof name === "string" ? name.slice(0, MAX_COURT_NAME_LENGTH) : ""));
    }

    // A missing/non-numeric/out-of-range round index (legacy saves predate this field,
    // or the schedule shrank) means "start at round 0" rather than crashing.
    function normalizeRoundIndex(index, schedule) {
      const roundCount = schedule && Array.isArray(schedule.rounds) ? schedule.rounds.length : 0;
      if (!Number.isInteger(index) || index < 0 || index >= roundCount) return 0;
      return index;
    }

    // Every match needs its own court, so a schedule has one court per four players.
    function getCourtCount() {
      return Math.floor(setupPlayers().length / 4);
    }

    // The players the setup shows: in a Mexicano setup that has not started, the
    // chosen count of default names (P1, P2, ...; the schedule held then is the
    // Americano one, kept for switching back); otherwise the schedule's players.
    function setupPlayers() {
      if (tournamentFormat === "mexicano" && !tournamentStarted) {
        return Array.from({ length: mexicanoPlayerCount }, (_, i) => "P" + (i + 1));
      }
      return currentSchedule && currentSchedule.players ? currentSchedule.players : [];
    }

    // Player names typed in a setup that has not started, per format, by input index.
    // They are kept while the Organizer changes the player count or switches format
    // and back; a slot without a draft shows its default name. Court names need no
    // draft: they live in courtNames whatever the format.
    let playerNameDrafts = { americano: [], mexicano: [] };
    let draftedFormat = null; // the format whose setup names are on screen; null: none

    // Remember the names on screen as the draft of the format they were typed for.
    // A smaller player count drops the names beyond it, so new slots start at
    // their defaults.
    function rememberPlayerNameDrafts() {
      if (!draftedFormat) return;
      const inputs = document.querySelectorAll("#playerInputsContainer input");
      playerNameDrafts[draftedFormat] = Array.from(inputs, input => input.value);
    }

    // Forget every draft (a new setup starts from the default names).
    function clearPlayerNameDrafts() {
      playerNameDrafts = { americano: [], mexicano: [] };
      draftedFormat = null;
    }

    // (Re)build the player and court name inputs for the active setup, keeping
    // the names typed so far (see playerNameDrafts).
    function renderSetupInputs() {
      rememberPlayerNameDrafts();
      const players = setupPlayers();
      const draft = tournamentStarted ? [] : playerNameDrafts[tournamentFormat];
      generatePlayerInputs(players.map((player, index) =>
        (typeof draft[index] === "string" ? draft[index] : player)));
      generateCourtNameInputs();
      draftedFormat = tournamentStarted ? null : tournamentFormat;
    }

    // A site may declare its own default court names in sites/<site>/courts.js.
    function getDefaultCourtName(courtNumber) {
      const siteNames = window.siteDefaultCourtNames;
      const siteName = Array.isArray(siteNames) ? siteNames[courtNumber - 1] : null;
      return (typeof siteName === "string" && siteName.trim()) ? siteName : "Court " + courtNumber;
    }

    function getCourtName(courtNumber) {
      const customName = (courtNames[courtNumber - 1] || "").trim();
      return customName || getDefaultCourtName(courtNumber);
    }

    function generateCourtNameInputs() {
      const container = document.getElementById("courtNamesContainer");
      container.innerHTML = ""; // Clear previous content

      const table = document.createElement("div");
      table.className = "court-names-table";

      for (let courtNumber = 1; courtNumber <= getCourtCount(); courtNumber++) {
        const input = document.createElement("input");
        input.type = "text";
        input.id = "courtNameInput_" + courtNumber;
        input.maxLength = 30;
        input.value = courtNames[courtNumber - 1] || "";
        input.placeholder = getDefaultCourtName(courtNumber);
        input.setAttribute("aria-label", "Name of court " + courtNumber);
        input.addEventListener("input", function () {
          courtNames[courtNumber - 1] = input.value;
          updateCourtLabels();
          updateNextRoundControl(); // its status names courts
          saveTournamentState();
        });
        table.appendChild(input);
      }

      container.appendChild(table);
    }

    // Refresh the labels of the courts currently on screen (names may change mid-tournament).
    function updateCourtLabels() {
      document.querySelectorAll("#tournamentContainer .court[data-court]").forEach(courtDiv => {
        const label = courtDiv.querySelector(".court-label");
        if (label) label.textContent = getCourtName(parseInt(courtDiv.dataset.court, 10));
      });
    }


    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }



    // --- Functions for Round and Match Rendering ---
    // The score inputs of one match. A locked round's (see isRoundLocked) are shown
    // read-only and never change the match.
    function createResultOverlay(match, roundIndex) {
      const locked = isRoundLocked(roundIndex);
      const overlayContainer = document.createElement('div');
      overlayContainer.className = 'result-overlay-container';
      const total = totalPoints; // fixed for the tournament: the setting is locked once started
      const leftOverlay = document.createElement('div');
      leftOverlay.className = 'result-overlay-left';
      const leftInput = document.createElement('input');
      leftInput.type = 'number';
      leftInput.min = '0';
      leftInput.value = '';
      leftOverlay.appendChild(leftInput);
      const rightOverlay = document.createElement('div');
      rightOverlay.className = 'result-overlay-right';
      const rightInput = document.createElement('input');
      rightInput.type = 'number';
      rightInput.min = '0';
      rightInput.value = '';
      rightOverlay.appendChild(rightInput);
      leftInput.disabled = locked;
      rightInput.disabled = locked;
      overlayContainer.appendChild(leftOverlay);
      overlayContainer.appendChild(rightOverlay);
      const errorSpan = document.createElement('span');
      errorSpan.className = 'error-message';
      overlayContainer.appendChild(errorSpan);
      if (match.result) {
        leftInput.value = match.result.left;
        rightInput.value = match.result.right;
      } else {
        match.result = { left: '', right: '' };
      }
      // Only a valid score (see parseScore) is completed; an empty or invalid
      // entry clears the other side, so no stale or negative complement remains.
      function updateOpposite(source, target) {
        const score = parseScore(source.value, total);
        target.value = score === null ? '' : String(total - score);
      }
      function validate() {
        const leftVal = parseScore(leftInput.value, total);
        const rightVal = parseScore(rightInput.value, total);
        const invalidEntry = (leftInput.value !== '' && leftVal === null) ||
          (rightInput.value !== '' && rightVal === null);
        if (invalidEntry) {
          errorSpan.textContent = " Each score must be a whole number from 0 to " + total;
        } else if (leftVal === null || rightVal === null) {
          errorSpan.textContent = " Please fill in both scores";
        } else if (leftVal + rightVal !== total) {
          errorSpan.textContent = " Sum must equal " + total;
        } else { errorSpan.textContent = ""; }
        // An invalid entry stays visible (with its error) but is not recorded.
        match.result = recordedResult(leftInput.value, rightInput.value, total);
        updateAllScoreboards();
        updateNextRoundControl();
        saveTournamentState();
      }
      // Re-checked on every edit, not only at render: a locked round's scores
      // have seeded a later round and must never change.
      function onEdit(source, target) {
        if (isRoundLocked(roundIndex)) return;
        updateOpposite(source, target);
        validate();
      }
      leftInput.addEventListener('input', function () { onEdit(leftInput, rightInput); });
      rightInput.addEventListener('input', function () { onEdit(rightInput, leftInput); });
      return overlayContainer;
    }

    function createCourtView(match, roundIndex) {
      const courtDiv = document.createElement('div');

      // Add 'court' class + dynamic court number class
      courtDiv.className = 'court';
      if (match.court) {
        courtDiv.classList.add(`court-${match.court}`);
        courtDiv.dataset.court = match.court;

        // Court names are user input: always set via textContent, never innerHTML.
        const courtLabel = document.createElement('div');
        courtLabel.className = 'court-label';
        courtLabel.textContent = getCourtName(match.court);
        courtDiv.appendChild(courtLabel);
      }

      const resultOverlay = createResultOverlay(match, roundIndex);
      courtDiv.appendChild(resultOverlay);

      const centerLine = document.createElement('div');
      centerLine.className = 'center-line';
      courtDiv.appendChild(centerLine);

      const teamLeft = document.createElement('div');
      teamLeft.className = 'team team-left';
      teamLeft.textContent = match.teams[0].join(" & ");
      courtDiv.appendChild(teamLeft);

      const teamRight = document.createElement('div');
      teamRight.className = 'team team-right';
      teamRight.textContent = match.teams[1].join(" & ");
      courtDiv.appendChild(teamRight);

      return courtDiv;
    }


    function createMatchContainer(match, roundIndex) {
      const container = document.createElement('div');
      container.className = 'match';
      container.dataset.teamLeft = match.teams[0].join(',');
      container.dataset.teamRight = match.teams[1].join(',');
      const courtView = createCourtView(match, roundIndex);
      container.appendChild(courtView);
      return container;
    }


    // The players resting this round, above its courts; null when nobody rests
    // (every multiple-of-four schedule). Player names are user input: always set
    // via textContent, never innerHTML.
    function createRestingStrip(round) {
      const resting = Array.isArray(round.byes) ? round.byes : [];
      if (resting.length === 0) return null;
      const strip = document.createElement("div");
      strip.className = "resting-players";
      const label = document.createElement("span");
      label.className = "resting-label";
      label.textContent = "Resting:";
      strip.appendChild(label);
      resting.forEach(player => {
        const name = document.createElement("span");
        name.className = "resting-player";
        name.textContent = player;
        strip.appendChild(name);
      });
      return strip;
    }

    function displayRound(roundIndex) {
      const container = document.getElementById("tournamentContainer");
      container.innerHTML = "";
      if (!currentSchedule || !currentSchedule.rounds || roundIndex < 0 || roundIndex >= currentSchedule.rounds.length) {
        container.textContent = "Round data not available.";
        return;
      }

      const round = currentSchedule.rounds[roundIndex];
      const roundDiv = document.createElement("div");
      roundDiv.className = "round";
      roundDiv.setAttribute("data-round", round.roundNumber);

      // --- Round Header ---
      const roundHeader = document.createElement("div");
      roundHeader.className = "round-header";

      // Left part: Round title.
      const headerLeft = document.createElement("div");
      headerLeft.className = "left";
      headerLeft.textContent = "Round " + round.roundNumber;

      // Center part: Navigation buttons.
      const headerCenter = document.createElement("div");
      headerCenter.className = "center";
      if (roundIndex > 0) {
        const prevBtn = document.createElement("button");
        prevBtn.innerHTML = "PREVIOUS ROUND"; // left arrow
        prevBtn.addEventListener("click", function () {
          currentRoundIndex--;
          displayRound(currentRoundIndex);
          saveTournamentState();
        });
        headerCenter.appendChild(prevBtn);
      }
      if (roundIndex < currentSchedule.rounds.length - 1) {
        const nextBtn = document.createElement("button");
        nextBtn.innerHTML = "NEXT ROUND"; // right arrow
        nextBtn.addEventListener("click", function () {
          currentRoundIndex++;
          displayRound(currentRoundIndex);
          saveTournamentState();
        });
        headerCenter.appendChild(nextBtn);
      }
      // Mexicano: the latest round offers the next one, generated from the standings.
      const latestMexicanoRound = tournamentFormat === "mexicano" && roundIndex === currentSchedule.rounds.length - 1;
      if (latestMexicanoRound) {
        const generateBtn = document.createElement("button");
        generateBtn.id = "generateNextRoundBtn";
        generateBtn.textContent = "GENERATE NEXT ROUND";
        generateBtn.setAttribute("aria-describedby", "nextRoundStatus");
        generateBtn.addEventListener("click", generateNextRound);
        headerCenter.appendChild(generateBtn);
      }

      // Right part: Save and New Tournament buttons.
      const headerRight = document.createElement("div");
      headerRight.className = "right";
      const saveBtn = document.createElement("button");
      saveBtn.id = "saveTournamentBtn";
      saveBtn.textContent = "Save Tournament";
      saveBtn.addEventListener("click", saveTournament);
      headerRight.appendChild(saveBtn);
      const newBtn = document.createElement("button");
      newBtn.id = "newTournamentBtn";
      newBtn.textContent = "New Tournament";
      newBtn.addEventListener("click", newTournament);
      headerRight.appendChild(newBtn);

      // Assemble the round header.
      roundHeader.appendChild(headerLeft);
      roundHeader.appendChild(headerCenter);
      roundHeader.appendChild(headerRight);
      roundDiv.appendChild(roundHeader);

      // Mexicano: what the next round waits for (latest round), or why a round is
      // read-only (every earlier one). Filled by updateNextRoundControl.
      if (latestMexicanoRound) {
        const status = document.createElement("p");
        status.id = "nextRoundStatus";
        status.className = "round-status";
        status.setAttribute("role", "status");
        roundDiv.appendChild(status);
      } else if (isRoundLocked(roundIndex)) {
        const note = document.createElement("p");
        note.className = "round-status round-locked-note";
        note.textContent = "Round " + round.roundNumber + " is locked: its scores seeded round " +
          (round.roundNumber + 1) + ".";
        roundDiv.appendChild(note);
      }

      // --- Round Body: Two Columns ---
      const roundBody = document.createElement("div");
      roundBody.className = "round-body";

      // Left Column: Scoreboard container.
      const scoreboardContainer = document.createElement("div");
      scoreboardContainer.className = "scoreboard-container";
      scoreboardContainer.id = "scoreboard-round-" + round.roundNumber;
      roundBody.appendChild(scoreboardContainer);

      // Right Column: Matches container.
      const matchesColumn = document.createElement("div");
      matchesColumn.className = "matches-column";
      const restingStrip = createRestingStrip(round);
      if (restingStrip) matchesColumn.appendChild(restingStrip);
      const matchesContainer = document.createElement("div");
      matchesContainer.className = "matches-container";
      round.matches.forEach(match => {
        const matchContainer = createMatchContainer(match, roundIndex);
        matchesContainer.appendChild(matchContainer);
      });
      matchesColumn.appendChild(matchesContainer);
      roundBody.appendChild(matchesColumn);

      roundDiv.appendChild(roundBody);
      container.appendChild(roundDiv);

      updateAllScoreboards();
      updateNextRoundControl();
      saveTournamentState();
    }

    // --- Mexicano round lifecycle ---
    // Only the latest Mexicano round is editable: every earlier one has seeded a
    // later round, so its scores are locked. Derived from the rounds list, never stored.
    function isRoundLocked(roundIndex) {
      return tournamentFormat === "mexicano" && tournamentStarted && !!currentSchedule &&
        roundIndex < currentSchedule.rounds.length - 1;
    }

    // The matches of the latest round that still lack a complete, valid score
    // (see isCompleteResult).
    function matchesMissingAScore() {
      const latest = currentSchedule.rounds[currentSchedule.rounds.length - 1];
      return latest.matches.filter(match => !isCompleteResult(match.result, totalPoints));
    }

    // Enable "Generate next round" only when the latest round is complete, and
    // otherwise say (and mark on the courts) which scores it is waiting for.
    // A no-op unless the latest Mexicano round is on screen.
    function updateNextRoundControl() {
      const button = document.getElementById("generateNextRoundBtn");
      const status = document.getElementById("nextRoundStatus");
      if (!button || !status || !isMexicanoPlay()) return;
      const missing = matchesMissingAScore();
      const full = currentSchedule.rounds.length >= MAX_ROUNDS;
      button.disabled = missing.length > 0 || full;
      const latest = currentSchedule.rounds[currentSchedule.rounds.length - 1];
      const containers = document.querySelectorAll("#tournamentContainer .matches-container > .match");
      latest.matches.forEach((match, index) => {
        if (containers[index]) containers[index].classList.toggle("score-missing", missing.includes(match));
      });
      // Court names are user input: textContent only.
      if (missing.length > 0) {
        status.textContent = "Waiting for a valid score on: " +
          missing.map(match => getCourtName(match.court)).join(", ") +
          ". The next round can be generated once every match has one.";
      } else if (full) {
        status.textContent = "All scores are in. This tournament has reached the maximum of " +
          MAX_ROUNDS + " rounds.";
      } else {
        status.textContent = "All scores are in: the next round can be generated.";
      }
    }

    function isMexicanoPlay() {
      return tournamentFormat === "mexicano" && tournamentStarted && !!currentSchedule &&
        Array.isArray(currentSchedule.rounds) && currentSchedule.rounds.length > 0;
    }

    // Rounds rested so far, per player (byes across every generated round). No
    // prototype, so player names like "constructor" or "__proto__" are plain keys.
    function mexicanoRestCounts() {
      const restCounts = Object.create(null);
      currentSchedule.players.forEach(player => { restCounts[player] = 0; });
      currentSchedule.rounds.forEach(round => {
        (Array.isArray(round.byes) ? round.byes : []).forEach(player => { restCounts[player] += 1; });
      });
      return restCounts;
    }

    // A generated Mexicano round in the app's round shape (byes are set by setByes).
    function toScheduleRound(generated) {
      return {
        roundNumber: generated.roundNumber,
        matches: generated.matches.map(match => ({
          court: match.court,
          teams: match.teams.map(team => team.slice()),
          result: null
        }))
      };
    }

    // Generate the round after the latest one, from the standings the scoreboard
    // shows after it, and move to it. Refused while a score is missing: the
    // missing ones are (re)indicated instead.
    function generateNextRound() {
      if (!isMexicanoPlay()) return;
      const rounds = currentSchedule.rounds;
      if (matchesMissingAScore().length > 0 || rounds.length >= MAX_ROUNDS) {
        updateNextRoundControl();
        return;
      }
      let generated;
      try {
        generated = window.Mexicano.nextRound({
          players: currentSchedule.players.slice(),
          standings: computeStandings(rounds.length - 1).map(entry => entry.player),
          restCounts: mexicanoRestCounts(),
          roundNumber: rounds.length + 1
        });
      } catch (err) {
        console.warn("Could not generate the next Mexicano round:", err);
        alert("The next round could not be generated.");
        return;
      }
      rounds.push(toScheduleRound(generated));
      setByes(currentSchedule);
      currentRoundIndex = rounds.length - 1;
      displayRound(currentRoundIndex);
      saveTournamentState();
    }

    // Start a Mexicano tournament: read the named players (as Americano does: a
    // blank name takes its default, names are at most 20 characters and unique),
    // draw a seed once, and generate round 1 from it. Returns whether it started.
    function startMexicano() {
      if (!window.Mexicano || typeof window.Mexicano.nextRound !== "function") {
        alert("Mexicano is not available: the pairing module could not be loaded.");
        return false;
      }
      const defaults = setupPlayers();
      const names = [];
      for (let i = 0; i < defaults.length; i++) {
        const input = document.getElementById("playerInput_" + i);
        const name = (input ? input.value.trim() : "") || defaults[i];
        if (name.length > 20) {
          alert("Player names must be 20 characters or less.");
          return false;
        }
        names.push(name);
      }
      if (new Set(names).size !== names.length) {
        alert("Player names must be unique.");
        return false;
      }
      const seed = crypto.getRandomValues(new Uint32Array(1))[0];
      let first;
      try {
        first = window.Mexicano.nextRound({ players: names, roundNumber: 1, seed: seed });
      } catch (err) {
        console.warn("Could not draw the first Mexicano round:", err);
        alert("The first round could not be drawn.");
        return false;
      }
      mexicanoSeed = seed;
      currentSchedule = setByes({ players: names.slice(), rounds: [toScheduleRound(first)] });
      // The settings show the players as they play (locked once started).
      generatePlayerInputs(currentSchedule.players);
      return true;
    }

    // The ranking after the rounds up to roundIndex, best first: the order the
    // scoreboard shows and Mexicano pairs by. Each entry: { player, score, placement }.
    function computeStandings(roundIndex) {
      // No prototype, so a player named "__proto__" is scored like any other.
      const scores = Object.create(null);
      if (currentSchedule && currentSchedule.players) {
        currentSchedule.players.forEach(player => { scores[player] = 0; });
      }
      const playedMatches = [];
      for (let i = 0; i <= roundIndex; i++) {
        const round = currentSchedule.rounds[i];
        round.matches.forEach(match => {
          if (match.result) {
            // Only a complete, valid result (see isCompleteResult) is credited;
            // anything else counts 0 for both teams.
            const complete = isCompleteResult(match.result, totalPoints);
            const leftScore = complete ? parseScore(match.result.left, totalPoints) : 0;
            const rightScore = complete ? parseScore(match.result.right, totalPoints) : 0;
            match.teams[0].forEach(player => { scores[player] += leftScore; });
            match.teams[1].forEach(player => { scores[player] += rightScore; });
            playedMatches.push({ teams: match.teams, scores: [leftScore, rightScore] });
          }
        });
      }
      // Built in player-list order (not by enumerating `scores`, which would list
      // integer-like names such as "10" first), so the stable sort keeps tied
      // players in player-list order.
      const players = currentSchedule && currentSchedule.players ? currentSchedule.players : [];
      const scoreArray = players.map(player => ({ player: player, score: scores[player] }));
      scoreArray.sort((a, b) => b.score - a.score);
      rankStandings(scoreArray, playedMatches);
      return scoreArray;
    }

    function updateAllScoreboards() {
      const scoreArray = computeStandings(currentRoundIndex);
      const currentRoundNum = currentSchedule.rounds[currentRoundIndex].roundNumber;
      const scoreboardContainer = document.getElementById("scoreboard-round-" + currentRoundNum);
      if (scoreboardContainer) {
        // Player names are user input: build the table with DOM APIs and set
        // cell text via textContent, never innerHTML. The shape (header row,
        // then one <tr> per player) is what the rank colours in style.css key on.
        // The explicit <tbody> matches the DOM the HTML parser used to produce.
        const table = document.createElement('table');
        const body = document.createElement('tbody');
        table.appendChild(body);
        const headerRow = document.createElement('tr');
        ['Player', 'Points'].forEach(label => {
          const th = document.createElement('th');
          th.textContent = label;
          headerRow.appendChild(th);
        });
        body.appendChild(headerRow);
        const rows = scoreArray.map(item => {
          const row = document.createElement('tr');
          row.dataset.placement = item.placement;
          const playerCell = document.createElement('td');
          playerCell.textContent = item.player;
          const scoreCell = document.createElement('td');
          scoreCell.textContent = item.score;
          row.appendChild(playerCell);
          row.appendChild(scoreCell);
          body.appendChild(row);
          return row;
        });
        scoreboardContainer.replaceChildren(table);
        colorRowsByPlacement(rows);
      }
    }

    // Orders tied players and assigns each standings entry its placement, in place.
    // Expects entries sorted by total points (descending). Placements follow standard
    // competition ranking: players sharing a placement repeat it and the next one
    // skips (1, 1, 3). A tie between exactly two players is resolved head-to-head:
    // the points each scored in the games where they were on opposing teams. When
    // they never opposed each other, or their mutual games are level, they share the
    // placement. Ties of three or more are always shared: pairwise comparisons can
    // form a cycle, and a single deterministic rule beats a partial resolution.
    // Shared entries keep their order from the sort (stable), i.e. player list order.
    function rankStandings(entries, playedMatches) {
      let start = 0;
      while (start < entries.length) {
        let end = start + 1;
        while (end < entries.length && entries[end].score === entries[start].score) end++;
        let advantage = 0;
        if (end - start === 2) {
          advantage = headToHeadAdvantage(entries[start].player, entries[start + 1].player, playedMatches);
          if (advantage < 0) {
            [entries[start], entries[start + 1]] = [entries[start + 1], entries[start]];
          }
        }
        for (let i = start; i < end; i++) {
          // A resolved pair takes consecutive placements; anything else shares one.
          entries[i].placement = advantage !== 0 ? i + 1 : start + 1;
        }
        start = end;
      }
    }

    // Points player a scored minus points player b scored across the games where
    // they were on opposing teams (0 when they never opposed each other).
    function headToHeadAdvantage(a, b, playedMatches) {
      let advantage = 0;
      playedMatches.forEach(match => {
        for (let side = 0; side < 2; side++) {
          if (match.teams[side].includes(a) && match.teams[1 - side].includes(b)) {
            advantage += match.scores[side] - match.scores[1 - side];
          }
        }
      });
      return advantage;
    }

    // style.css colours the standings by row position (gold, silver, bronze, then
    // grey). With shared placements a row's colour must follow its placement
    // instead, so a row whose placement differs from its position takes the colour
    // the stylesheet gives the row AT that placement's position (every placement
    // is at or above its own row, so that row exists). The palette is read from
    // the stylesheet, not repeated here, and read before any row is overridden.
    function colorRowsByPlacement(rows) {
      const COLOR_TIERS = 4; // gold, silver, bronze, then one colour for the rest
      const tierOf = position => Math.min(position, COLOR_TIERS) - 1;
      const palette = rows.slice(0, COLOR_TIERS).map(row => getComputedStyle(row).backgroundColor);
      rows.forEach((row, index) => {
        const tier = tierOf(Number(row.dataset.placement));
        if (tier !== tierOf(index + 1)) row.style.backgroundColor = palette[tier];
      });
    }

    function disableSettings() {
      document.getElementById("formatSelect").disabled = true;
      document.getElementById("playerCountSelect").disabled = true;
      document.getElementById("scheduleSelect").disabled = true;
      document.getElementById("globalTotalPoints").disabled = true;
      // Remove or comment out the next line so the tournament name remains enabled.
      // document.getElementById("tournamentName").disabled = true;
      const inputs = document.querySelectorAll("#playerInputsContainer input, #playerInputsContainer textarea");
      inputs.forEach(input => input.disabled = true);
      document.getElementById("startTournamentBtn").disabled = true;
    }


    function toggleSettings() {
      const settingsDiv = document.getElementById("settingsContainer");
      settingsDiv.style.display = (settingsDiv.style.display === "none") ? "block" : "none";
    }

    // The schedule a #scheduleSelect value names: "<N>p<R>r.js" is the module (a
    // script tag in <head>) that sets window.schedule<N>p<R>r. Only values the
    // dropdown offers are looked up; null for anything else or a missing module.
    function scheduleForModule(moduleName) {
      const offered = Array.from(document.getElementById("scheduleSelect").options)
        .some(option => option.value === moduleName);
      const match = offered ? /^(\d+p\d+r)\.js$/.exec(moduleName) : null;
      const schedule = match ? window["schedule" + match[1]] : null;
      return isPlainObject(schedule) && Array.isArray(schedule.players) && Array.isArray(schedule.rounds)
        ? schedule : null;
    }

    function loadScheduleFromModule(moduleName) {
      const schedule = scheduleForModule(moduleName);
      if (!schedule) {
        console.error("Unknown module name:", moduleName);
        return;
      }
      currentSchedule = schedule;
      storeDefaultPlayerNames(currentSchedule.players);
      setByes(currentSchedule);
      // Clear previous match results and (if needed) store teamIndices.
      currentSchedule.rounds.forEach(round => {
        round.matches.forEach(match => {
          match.result = null;
          match.teamIndices = match.teams.map(team =>
            team.map(oldName => defaultPlayerNames.indexOf(oldName))
          );
        });
      });
      generatePlayerInputs(currentSchedule.players);
      generateCourtNameInputs();
      document.getElementById("tournamentContainer").innerHTML = "";
      localStorage.removeItem("tournamentState");
    }

    // --- Tournament format ---
    function populatePlayerCountSelect() {
      const select = document.getElementById("playerCountSelect");
      for (let count = MIN_MEXICANO_PLAYERS; count <= MAX_MEXICANO_PLAYERS; count++) {
        const option = document.createElement("option");
        option.value = String(count);
        option.textContent = String(count);
        select.appendChild(option);
      }
    }
    populatePlayerCountSelect();

    // Show the setup controls of the active format. Americano: the precomputed
    // schedules, exactly as before formats existed. Mexicano: a player count instead
    // of a schedule (its rounds are generated during play). Player names, court
    // names and the points control are shared by both; the player and court inputs
    // themselves follow the format's player count (see renderSetupInputs).
    // Visibility is set via style.display, because the player-name grid's own CSS
    // display would override the hidden attribute.
    function applyFormatUI() {
      const mexicano = tournamentFormat === "mexicano";
      const show = (element, visible) => { element.style.display = visible ? "" : "none"; };
      // Set from memory, which also overrides any form state the browser restored on reload.
      document.getElementById("formatSelect").value = tournamentFormat;
      document.getElementById("playerCountSelect").value = String(mexicanoPlayerCount);
      document.getElementById("globalTotalPoints").value = String(totalPoints);
      show(document.getElementById("scheduleSelectLabel"), !mexicano);
      show(document.getElementById("scheduleSelect"), !mexicano);
      show(document.getElementById("playerCountLabel"), mexicano);
      show(document.getElementById("playerCountSelect"), mexicano);
      // A running tournament keeps its locked setup (see disableSettings).
      if (!tournamentStarted) document.getElementById("startTournamentBtn").disabled = false;
    }

    // A format or player-count choice is saved right away, so it survives a reload
    // before the tournament starts. The player and court inputs follow the new
    // player count, starting from the default names.
    document.getElementById("formatSelect").addEventListener("change", function () {
      tournamentFormat = normalizeFormat(this.value);
      renderSetupInputs();
      applyFormatUI();
      saveTournamentState();
    });
    document.getElementById("playerCountSelect").addEventListener("change", function () {
      mexicanoPlayerCount = normalizeMexicanoPlayerCount(parseInt(this.value, 10));
      renderSetupInputs();
      applyFormatUI();
      saveTournamentState();
    });

    // Event Listeners.
    document.getElementById("scheduleSelect").addEventListener("change", function () {
      loadScheduleFromModule(this.value);
    });
    document.getElementById("globalTotalPoints").addEventListener("change", function () {
      totalPoints = normalizeTotalPoints(parseInt(this.value, 10));
      updateAllScoreboards();
      saveTournamentState();
    });


    document.getElementById("toggleSettingsBtn").addEventListener("click", toggleSettings);
    document.getElementById("loadTournamentBtn").addEventListener("click", loadTournament);
    document.getElementById("deleteTournamentBtn").addEventListener("click", deleteTournament);

    // Auto-save state before unload (to handle crashes/reloads).
    window.addEventListener("beforeunload", function () {
      saveTournamentState();
    });

    // Randomize players on tournament start.
    function updatePlayerNamesFromInputs() {
      if (!currentSchedule || !currentSchedule.players) {
        alert("No schedule loaded.");
        return;
      }

      let newNames = [];
      for (let i = 0; i < currentSchedule.players.length; i++) {
        const input = document.getElementById("playerInput_" + i);
        let name = input.value.trim();

        if (!name) {
          name = defaultPlayerNames[i]; // Use default if empty
        }
        newNames.push(name);
      }

      if (new Set(newNames).size !== newNames.length) {
        alert("Player names must be unique.");
        return;
      }

      // Update current schedule with new names
      currentSchedule.players = newNames.slice();

      // Update matches to reflect new names
      currentSchedule.rounds.forEach(round => {
        round.matches.forEach(match => {
          match.teams = match.teamIndices.map(indices =>
            indices.map(i => newNames[i])
          );
        });
      });
      setByes(currentSchedule); // the resting players take their new names too

      if (tournamentStarted) displayRound(currentRoundIndex);
      saveTournamentState();
    }

    function randomizePlayers() {
      const numPlayers = currentSchedule.players.length;
      let names = [];
      for (let i = 0; i < numPlayers; i++) {
        const input = document.getElementById("playerInput_" + i);
        // Use the value if present, otherwise use the default name.
        let name = input.value.trim();
        if (!name) {
          name = defaultPlayerNames[i];
        }
        if (name.length > 20) {
          alert("Player names must be 20 characters or less.");
          return false;
        }
        names.push(name);
      }
      // Check uniqueness.
      const uniqueNames = new Set(names);
      if (uniqueNames.size !== names.length) {
        alert("Player names must be unique.");
        return false;
      }
      // Optionally shuffle names if desired.
      names = shuffleArray(names);
      currentSchedule.players = names.slice();
      // Update the table inputs so the user sees the new names.
      const container = document.getElementById("playerInputsContainer");
      const inputs = container.querySelectorAll("input");
      inputs.forEach((input, index) => {
        input.value = names[index];
      });
      // Also update our stored names.
      updatePlayerNamesFromInputs();
      return true;
    }

    // Site variants shipped under web/sites/. Add a folder here when adding a site.
    const KNOWN_SITES = ['default', 'libro', 'was'];

    function getSiteNameFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const site = urlParams.get('site') || 'default';
      // The site name becomes part of asset and script paths (including
      // sites/<site>/courts.js): accept only a plain folder name, and only one of
      // the reviewed site folders, so it can never traverse out of sites/ or
      // select an unreviewed script.
      return /^[A-Za-z0-9_-]+$/.test(site) && KNOWN_SITES.includes(site) ? site : 'default';
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Get the 'site' parameter from the URL
      const site = getSiteNameFromURL()

      // Build the path to the background image dynamically
      const bgUrl = `./sites/${site}/bg.jpg`;

      // Set the background image on the body
      document.body.style.backgroundImage = `url('${bgUrl}')`;
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundPosition = 'center center';
      document.body.style.backgroundAttachment = 'fixed';
      document.body.style.backgroundSize = 'cover'; // Optional for full coverage

      // Dynamically load the site's court styles
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `./sites/${site}/courts.css`;
      document.head.appendChild(link);

      // Load the site's default court names (sets window.siteDefaultCourtNames).
      // Inserted before the load event, so it has run before any round is rendered.
      const courtNamesScript = document.createElement('script');
      courtNamesScript.src = `./sites/${site}/courts.js`;
      document.head.appendChild(courtNamesScript);

      const logoImg = document.getElementById('siteLogo');
      logoImg.src = `sites/${site}/logo.png`;

    });

  </script>
</body>
