<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Lay the page out at the device's width (phones otherwise lay it out about
       980px wide and scale it down). User zoom stays enabled. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padel Turrar Tournament Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Players resting this round (counts that are not a multiple of 4);
       styled like the scoreboard panel. */
    .resting-players {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 20px;
    }
    .resting-players .resting-label {
      font-weight: bold;
      margin-right: 0.5em;
    }
    .resting-players .resting-player + .resting-player::before {
      content: ", ";
    }
    /* Mexicano: what the next round is waiting for, and the rounds it locked. */
    .round-status {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin: 0 0 10px 0;
    }
    .match.score-missing .court {
      outline: 4px dashed #ff8c00;
      outline-offset: 2px;
    }
    /* In the accessibility tree, off screen: the announcer of the next round's
       state (#nextRoundAnnouncement), whose visible counterpart is #nextRoundStatus. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    /* Unavailable, not disabled (AB#70): aria-disabled keeps it focusable, so
       its explanation (aria-describedby) stays reachable by keyboard. */
    .round-header .center button[aria-disabled="true"] {
      background-color: #8a9a8a;
      cursor: not-allowed;
    }
    /* The auto-save warning (#autoSaveWarning, the first element of the body).
       Empty, while saving works, it is a zero-height box: it takes no space and
       covers nothing. Filled, it is an opaque, high-contrast banner in the page
       flow above the header, so at the top of the page it covers nothing, and it
       sticks to the top of the viewport once the page scrolls, above the round
       view (whose courts are positioned elements), so it stays in sight in every
       view. Scrolled content passes beneath it and can always be scrolled clear. */
    .auto-save-warning {
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .auto-save-warning:not(:empty) {
      margin: 0 0 10px 0;
      padding: 10px 14px;
      background-color: #a40000; /* white text on it: contrast about 8.14:1 */
      color: #fff;
      font-weight: bold;
      text-align: center;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
  <!-- Multiples of 4: perfect-whist tables (scheduler/whist-generate.js).
       Other counts: rest-round tables (scheduler/engine/sitout-generate.mjs). -->
  <script src="schedules/8p7r.js"></script>
  <script src="schedules/9p9r.js"></script>
  <script src="schedules/10p10r.js"></script>
  <script src="schedules/11p11r.js"></script>
  <script src="schedules/12p11r.js"></script>
  <script src="schedules/13p13r.js"></script>
  <script src="schedules/14p14r.js"></script>
  <script src="schedules/15p15r.js"></script>
  <script src="schedules/16p15r.js"></script>
  <script src="schedules/17p17r.js"></script>
  <script src="schedules/18p18r.js"></script>
  <script src="schedules/19p19r.js"></script>
  <script src="schedules/20p19r.js"></script>
  <script src="schedules/21p21r.js"></script>
  <script src="schedules/22p22r.js"></script>
  <script src="schedules/23p23r.js"></script>
  <script src="schedules/24p23r.js"></script>
  <!-- Mexicano pairing (window.Mexicano): generates each Mexicano round from the standings. -->
  <script src="mexicano.js"></script>
</head>

<body>
  <!-- Shown while the tournament state cannot be auto-saved (see reportAutoSave).
       In the markup from the start and only ever empty or filled, so the alert is
       a live region before its text arrives: an empty one announces nothing.
       First in the body, so that while filled it sits above the header at the top
       of the page and sticks to the top of the viewport in every view (setup and
       play alike; the scoreboard is part of the round view). -->
  <div id="autoSaveWarning" class="auto-save-warning" role="alert"></div>

  <!-- Header: Tournament Title and Site Name -->
  <div id="header" class="header-with-logo">
    <img id="siteLogo" src="" alt="Site Logo" />
    <div class="header-text">
      <h1 id="tournamentTitle">Tournament Title</h1>
      <p id="siteName">Powered by Padel Turrar</p>
    </div>
  </div>

  <!-- Every control is in #settingsContainer, #toggleSettingsBtn or
       #tournamentContainer. They are inert (no clicks, typing or focus) until the
       initial restore has run (see releaseControls): a choice made while the page
       is still loading would act on the not-yet-restored default. -->
  <div id="settingsContainer" inert data-inert-until-restored>
    <div class="global-controls">
      <label for="formatSelect">Format:</label>
      <select id="formatSelect">
        <option value="americano" selected>Americano</option>
        <option value="mexicano">Mexicano</option>
      </select>
      <!-- Mexicano: the Organizer picks a player count; rounds are generated during play. -->
      <label for="playerCountSelect" id="playerCountLabel" style="display:none;">Players:</label>
      <select id="playerCountSelect" style="display:none;">
        <!-- Options (MIN_MEXICANO_PLAYERS..MAX_MEXICANO_PLAYERS) are generated below. -->
      </select>
      <label for="scheduleSelect" id="scheduleSelectLabel">Select Schedule:</label>
      <!-- Each value <N>p<R>r.js names the module that sets window.schedule<N>p<R>r
           (see loadScheduleFromModule); every option needs its script tag above. -->
      <select id="scheduleSelect">
        <option value="8p7r.js">8 Player, 7 Round Schedule</option>
        <option value="9p9r.js">9 Player, 9 Round Schedule</option>
        <option value="10p10r.js">10 Player, 10 Round Schedule</option>
        <option value="11p11r.js">11 Player, 11 Round Schedule</option>
        <option value="12p11r.js" selected>12 Player, 11 Round Schedule</option>
        <option value="13p13r.js">13 Player, 13 Round Schedule</option>
        <option value="14p14r.js">14 Player, 14 Round Schedule</option>
        <option value="15p15r.js">15 Player, 15 Round Schedule</option>
        <option value="16p15r.js">16 Player, 15 Round Schedule</option>
        <option value="17p17r.js">17 Player, 17 Round Schedule</option>
        <option value="18p18r.js">18 Player, 18 Round Schedule</option>
        <option value="19p19r.js">19 Player, 19 Round Schedule</option>
        <option value="20p19r.js">20 Player, 19 Round Schedule</option>
        <option value="21p21r.js">21 Player, 21 Round Schedule</option>
        <option value="22p22r.js">22 Player, 22 Round Schedule</option>
        <option value="23p23r.js">23 Player, 23 Round Schedule</option>
        <option value="24p23r.js">24 Player, 23 Round Schedule</option>
      </select>
      <label for="globalTotalPoints">Global Total Points:</label>
      <select id="globalTotalPoints">
        <option value="16">16</option>
        <option value="21">21</option>
        <option value="24" selected>24</option>
        <option value="32">32</option>
      </select>
    </div>


    <div class="tournament-info">
      <label for="tournamentName">Tournament Name:</label>
      <input type="text" id="tournamentName" placeholder="Enter tournament name" maxlength="200" />
    </div>

    <!-- Move Start Tournament Button Below -->
    <div class="start-button-container">
      <button id="startTournamentBtn">Start Tournament</button>
    </div>

    <div id="playerInputsContainer">
      <!-- Player input fields will be generated here -->
    </div>

    <div class="court-names-section">
      <label>Court Names:</label>
      <div id="courtNamesContainer">
        <!-- Court name input fields (one per court) will be generated here -->
      </div>
    </div>

    <!-- New container to properly space the saved tournaments section -->
    <div class="saved-tournaments-container">
      <label for="savedTournamentSelect">Saved Tournaments:</label>
      <select id="savedTournamentSelect"></select>
      <button id="loadTournamentBtn">Load Tournament</button>
      <button id="deleteTournamentBtn">Delete Tournament</button>
    </div>

  </div>
  <button id="toggleSettingsBtn" style="display:none;" inert data-inert-until-restored>Tournament Settings</button>

  <!-- Tournament container: displays one round at a time -->
  <div id="tournamentContainer" class="schedule-container" inert data-inert-until-restored></div>

  <!-- Mexicano: announces the next round's state (see announceNextRoundState).
       Outside #tournamentContainer, so no re-render replaces it: it is a live
       region before any text arrives, and what it last announced (data-key)
       survives round navigation. Visually hidden: the visible line is the
       button's description, #nextRoundStatus, which names courts as they are named now. -->
  <div id="nextRoundAnnouncement" class="visually-hidden" role="status" aria-atomic="true"></div>

  <script>
    let currentSchedule = null;
    let defaultPlayerNames = []; // stores original names from schedule load
    let tournamentStarted = false;
    let currentRoundIndex = 0; // 0-indexed
    let courtNames = []; // custom court names, index 0 = court 1; empty = use the default name
    let autoSaveFailing = false; // whether the last auto-save of the state failed (see reportAutoSave)
    let autoSaveRetryTimer = null; // the pending retry of a failed auto-save, if any (see retryFailedAutoSave)
    // The name the running tournament started under when Start could not check
    // it against the saved tournaments (getUniqueTournamentName), or null: it may
    // be a saved tournament's name. While the name input holds this name, Save
    // and Delete check it before they write the saved list (checkedTournamentName);
    // any other name the Organizer types is saved and deleted by name, as usual.
    // Set by Start; cleared by a Start that read the list, by Load, by dropping
    // the tournament held (resetTournamentMemory: New Tournament, Delete) and once
    // the name is checked (adoptCheckedTournamentName).
    let uncheckedTournamentName = null;
    // The text of the auto-save warning (see reportAutoSave). It states only what
    // is known: the changes are not being saved now, and the next auto-save that
    // works saves the whole state, the changes made meanwhile included. It names
    // the triggers the Organizer controls: the next change that saves, and
    // returning to the page (retryFailedAutoSave; another tab freeing storage
    // retries too, see storageChangeMayFreeRoom). It claims no more: the warning
    // stays until a save has worked, so while it shows, nothing is saved.
    // It names no cause (a failed write may be full or blocked storage, or a state
    // that cannot be serialized) and points at no in-app action: the only way the
    // app frees storage, Delete Tournament, also resets the running tournament.
    const AUTO_SAVE_WARNING = "Scores and other changes are not being saved in this browser right now. " +
      "Keep this page open: saving is tried again when you change something or return to this page, and this warning disappears once a save works.";

    // Tournament format. Americano plays a precomputed schedule. Mexicano is set up by
    // player count and played one round at a time: round 1 is a seeded random draw,
    // every later round is generated (web/mexicano.js) from the standings once the
    // current round is complete. currentSchedule.rounds is then the list of rounds
    // generated so far; every round but the latest has seeded a later one, so its
    // scores are locked (derived, never stored: see isRoundLocked).
    const FORMATS = ["americano", "mexicano"];
    const DEFAULT_FORMAT = "americano";
    const MIN_MEXICANO_PLAYERS = 8;
    const MAX_MEXICANO_PLAYERS = 24;
    const DEFAULT_MEXICANO_PLAYERS = 12;
    const MAX_MEXICANO_SEED = 0xFFFFFFFF; // the round-1 draw's seed is an unsigned 32-bit integer
    let tournamentFormat = DEFAULT_FORMAT;
    let mexicanoPlayerCount = DEFAULT_MEXICANO_PLAYERS;
    let mexicanoSeed = null; // drawn once when a Mexicano tournament starts; null otherwise

    // Points total: the two scores of every match sum to it. It belongs to the
    // tournament (persisted with it), and #globalTotalPoints only displays and sets it.
    const POINT_POOLS = [16, 21, 24, 32]; // the #globalTotalPoints options
    const DEFAULT_TOTAL_POINTS = 24;
    let totalPoints = DEFAULT_TOTAL_POINTS;

    // Limits for anything read back from localStorage (see "Persisted-state validation").
    // Each is at least as loose as what the app itself can write.
    const MAX_PLAYER_NAME_LENGTH = 30; // the player name inputs' maxLength (start allows 20)
    const MAX_COURT_NAME_LENGTH = 30; // the court name inputs' maxLength
    const MAX_PLAYERS = 64; // shipped schedules have 8-24 (any count)
    const MAX_ROUNDS = 128; // shipped schedules have 7-23
    // Every other stored string the copy layer keeps (tournament names, scores,
    // savedAt) is cut to this length: repaired, never dropped. Nothing the app
    // writes from typed input is ever cut: a typed tournament name is at most 200
    // characters (the name input's maxlength) plus a unique-name suffix, savedAt
    // is an ISO date, and score entry records only scores the score rule accepts,
    // which are always shorter than this (see parseScore). A name restored or
    // loaded from crafted data can already be up to this long; Start may then add
    // a suffix that the next load cuts off again (the documented collision case).
    const MAX_STORED_STRING_LENGTH = 1000;
    // The longest stored state that is backed up before a fallback drops it (see
    // backupStoredState). The largest state the copy layer accepts with ordinary
    // scores (64 players with 30-character names, 128 rounds of 16 courts)
    // serializes to about 0.47 million characters, and the shipped schedules and
    // Mexicano (at most 24 players) to far less, so this leaves twice that
    // headroom while bounding what one fallback can make the app keep in storage.
    // Only a state padded far beyond that (such as scores zero-padded to hundreds
    // of digits) exceeds it, and is then dropped without a backup (logged).
    const MAX_BACKUP_LENGTH = 1000000;

    // localStorage keys. The origin's storage is shared with every other page served
    // from it (see "Persisted-state validation"), so the app's keys carry its own
    // prefix. The unprefixed legacy keys are only ever read to migrate them, and a
    // migrated key's marker stops it being migrated again (see migrateLegacyStorage).
    const STATE_KEY = "padeltournament:tournamentState";
    const SAVED_TOURNAMENTS_KEY = "padeltournament:savedTournaments";
    // A copy of the raw stored state a fallback on load last dropped, as unusable
    // or because restoring it threw (one generation, overwritten each time; see
    // backupStoredState for what is and is not backed up).
    const STATE_BACKUP_KEY = "padeltournament:tournamentState.backup";
    const LEGACY_STATE_KEY = "tournamentState";
    const LEGACY_SAVED_TOURNAMENTS_KEY = "savedTournaments";
    const STATE_MIGRATED_KEY = "padeltournament:migrated:tournamentState";
    const SAVED_TOURNAMENTS_MIGRATED_KEY = "padeltournament:migrated:savedTournaments";

    // Legacy migrations whose copy could not be stored on load, by prefixed key
    // (see migrateLegacyKey). Each is { legacyKey, legacyRaw, migratedKey, raw,
    // lossless }: legacyRaw is the legacy value as read then, raw the copy as it
    // would be stored. Until the app's first write of that key that works
    // (writeAppValue), the app reads raw as the key's stored value: the state the
    // load restores, the saved list. The state's record gets abandoned: true once
    // the app drops the legacy tournament (abandonPendingState).
    const pendingMigrations = {};

    // Whether the initial restore (the load handler) has begun. Until then the
    // state in memory is the not-yet-restored default, so the stored state is
    // neither saved over nor removed (saveTournamentState, removeStoredState), and
    // no control takes effect (the guard below, and releaseControls).
    let initialRestoreBegun = false;
    // Whether the initial restore has finished (restored, or fallen back to a fresh
    // setup). Only then is a pending legacy state stored, so a restore that throws
    // can never complete its migration (see saveTournamentState; the fallback
    // drops the pending migration, leaving the legacy value unmigrated).
    let initialRestoreDone = false;

    // Until the initial restore, every event that could reach a control's handler
    // is stopped here, before it gets there. The controls are inert as well (see
    // releaseControls), which stops the Organizer's clicks, typing and focus; this
    // also stops events dispatched from script, which inert does not.
    ["click", "input", "change"].forEach(function (type) {
      document.addEventListener(type, function (event) {
        if (!initialRestoreBegun) event.stopImmediatePropagation();
      }, true);
    });

    // Migrate the legacy keys now, synchronously, while this script is still
    // running: no handler that writes is registered yet (only the guard above), so
    // nothing the app does can write a prefixed key first and pre-empt the
    // migration. It needs no DOM, and reads only bindings declared above this line
    // (moving one below it is a TDZ error the per-key catch would hide as a
    // skipped migration).
    migrateLegacyStorage();

    // Update header when tournament name changes.
    // DEFERRED: AB#105 (the rename is not auto-saved on input; the leave prompt covers only a shown warning, so a rename after storage fills can be lost without a prompt)
    document.getElementById("tournamentName").addEventListener("input", function () {
      document.getElementById("tournamentTitle").textContent = this.value || "Tournament Title";
    });

    // Save tournament state to localStorage. Before the initial restore has begun
    // it saves nothing: leaving the page while it is still loading (beforeunload,
    // which is no control and so passes the guard above) would otherwise write the
    // not-yet-restored default (with no schedule) over the stored tournament,
    // which the restore would then drop as unusable. While a pending legacy state
    // is being restored it saves nothing either: the load handler saves it once
    // the restore has succeeded, completing its migration.
    function saveTournamentState() {
      if (!initialRestoreBegun) return;
      if (!initialRestoreDone && pendingMigrations[STATE_KEY]) return;
      // This is now the latest attempt: a pending retry would only repeat it (see
      // retryFailedAutoSave).
      cancelAutoSaveRetry();
      const state = {
        schedule: currentSchedule,
        currentRoundIndex: currentRoundIndex,
        tournamentStarted: tournamentStarted,
        tournamentName: document.getElementById("tournamentName").value,
        courtNames: courtNames.slice(),
        format: tournamentFormat,
        mexicanoPlayerCount: mexicanoPlayerCount,
        mexicanoSeed: mexicanoSeed,
        totalPoints: totalPoints
      };
      reportAutoSave(writeAppValue(STATE_KEY, state));
    }

    // Remove the stored tournament state; like saveTournamentState, not before the
    // initial restore has begun.
    function removeStoredState() {
      if (!initialRestoreBegun) return;
      removeStoredValue(STATE_KEY);
    }

    // The app drops the tournament it holds for another one (a new setup, another
    // schedule, a loaded tournament, a Mexicano start, which draws a new
    // schedule). If that was a pending legacy state, what the app stores from now
    // on no longer holds the legacy data: its migration completes without
    // removing the legacy value (writeAppValue, retireLegacyValue).
    function abandonPendingState() {
      if (pendingMigrations[STATE_KEY]) pendingMigrations[STATE_KEY].abandoned = true;
    }

    // Make the controls usable: the end of the initial restore.
    // DEFERRED: AB#99 (restore timing: controls wait for the window load event)
    function releaseControls() {
      document.querySelectorAll("[data-inert-until-restored]").forEach(element => {
        element.removeAttribute("inert");
      });
    }

    // Show the auto-save warning while saving the tournament state fails, and clear
    // it on the next save that succeeds. Only this auto-save reports here: the Save
    // button reports its own outcome (an alert), and a failed migration or backup
    // write on load is no auto-save (it is logged). The text changes only when the
    // outcome does, so a save that keeps failing is announced once, not per save.
    // It reads only bindings declared above the early migrateLegacyStorage() call
    // (autoSaveFailing, AUTO_SAVE_WARNING) and an element that precedes this script.
    // While it is shown, a failed save is retried without a change, and leaving
    // the page tries again and may ask first (see retryFailedAutoSave, saveOnLeaving
    // and the beforeunload handler).
    function reportAutoSave(saved) {
      if (autoSaveFailing === !saved) return; // no change of outcome
      autoSaveFailing = !saved;
      document.getElementById("autoSaveWarning").textContent = saved ? "" : AUTO_SAVE_WARNING;
    }

    // Store a value as JSON. A failed write (storage full or unavailable, a value
    // that cannot be serialized) is logged and reported as false; it never aborts
    // the action that triggered it.
    function writeStoredJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (err) {
        console.warn("Could not write localStorage value:", key, err);
        return false;
      }
    }

    // Store a value of the app under one of its prefixed keys (STATE_KEY or
    // SAVED_TOURNAMENTS_KEY), reporting whether it was stored. While that key's
    // legacy migration is pending, a write that works completes the migration
    // (writeMigratedValue), noting whether the value still holds the legacy data:
    // the state unless the app has dropped it since (abandonPendingState), the
    // saved list if it keeps every legacy save unchanged.
    // Accepted multi-tab risk (localStorage has no compare-and-set): while the
    // state's migration is pending here, another tab may store a tournament under
    // the key; this tab's next save then overwrites it, as any two tabs saving
    // the one stored state do.
    function writeAppValue(key, value) {
      const migration = pendingMigrations[key];
      if (!migration) return writeStoredJson(key, value);
      const carried = key === SAVED_TOURNAMENTS_KEY
        ? keepsEverySavedTournament(value, migration.raw)
        : !migration.abandoned;
      if (!writeMigratedValue(key, value, migration, carried)) return false;
      delete pendingMigrations[key];
      return true;
    }

    // Write the first value under key since its legacy value was read (migration:
    // see pendingMigrations), and report whether it was stored. carried: whether
    // the value holds the legacy data.
    // The migrated marker is written first, and the value only once the marker is
    // stored, so a value never stands under key without its marker: that would
    // let the legacy value be migrated again, over later data, whenever the key is
    // later removed. A value that cannot be written takes back off a marker this
    // call wrote, so the migration is tried again on a later load; a marker that
    // was already there (another tab completed the migration) is left alone, and
    // what to do with the legacy value was that tab's call.
    // Accepted risk: if taking the marker back off fails too (storage unavailable),
    // or the browser dies between the two writes, the marker stands without the
    // value; the legacy value is then left in place but never migrated.
    // Accepted multi-tab risk (localStorage has no compare-and-set): the marker is
    // checked, then written. Another tab can do the same in between, so both may
    // take it as their own. At worst a tab whose value write fails then takes off
    // the marker the other tab's stored value relies on: that value stands without
    // its marker, so the legacy value can be migrated again if the app later
    // removes it and the page is closed before its next save. Otherwise both tabs
    // judge removing the legacy value, each by the rules of retireLegacyValue.
    function writeMigratedValue(key, value, migration, carried) {
      const markerWritten = !storedValueExists(migration.migratedKey);
      if (markerWritten && !writeStoredJson(migration.migratedKey, true)) return false;
      if (!writeStoredJson(key, value)) {
        if (markerWritten) removeStoredValue(migration.migratedKey);
        return false;
      }
      if (markerWritten) retireLegacyValue(migration, carried);
      return true;
    }

    // Remove a migrated legacy value, but only once its data is stored and only if
    // it is still exactly the value that was migrated: carried (the value stored
    // holds the legacy data), lossless (isLosslessCopy) and unchanged since it was
    // read (another page may have written the key since). Otherwise it is left in
    // place, never read again (the marker).
    function retireLegacyValue(migration, carried) {
      const legacyKey = migration.legacyKey;
      try {
        if (!carried) {
          console.warn("The app no longer holds the legacy localStorage value it migrated; leaving the value in place:", legacyKey);
        } else if (!migration.lossless) {
          console.warn("Migrated the usable part of a legacy localStorage value; leaving the value in place:", legacyKey);
        } else if (localStorage.getItem(legacyKey) !== migration.legacyRaw) {
          console.warn("A legacy localStorage value changed after it was read for migration; leaving it in place:", legacyKey);
        } else {
          localStorage.removeItem(legacyKey);
        }
      } catch (err) {
        console.error("Could not migrate a legacy localStorage value; leaving it in place:", legacyKey, err);
      }
    }

    // Whether a localStorage key holds a value; storage that cannot be read counts
    // as holding none (a write to it then fails and is reported as such).
    function storedValueExists(key) {
      try {
        return localStorage.getItem(key) !== null;
      } catch (err) {
        return false;
      }
    }

    // Whether a saved list about to be written keeps every saved tournament of
    // raw (a pending legacy list's copy) unchanged. It rebuilds that copy on each
    // call, which only Save and Delete make, and only while the migration is pending.
    function keepsEverySavedTournament(savedTournaments, raw) {
      const kept = new Set(savedTournaments.map(entry => JSON.stringify(entry)));
      return copySavedTournamentList(raw).every(entry => kept.has(JSON.stringify(entry)));
    }

    // The pending migration of key (see pendingMigrations), given raw, the value
    // now stored under key. A stored value is newer data (another tab wrote it):
    // the pending migration is dropped, as a migration on load skips such a key.
    function pendingMigrationFor(key, raw) {
      if (raw !== null) delete pendingMigrations[key];
      return pendingMigrations[key] || null;
    }

    // Restore the tournament state from raw, the stored value as read once on load
    // (readRawStoredState; null for none), into memory. Returns false when there is
    // none or it is unusable: an unusable one is backed up (backupStoredState) and
    // dropped from storage. The caller then starts from the default schedule.
    // Rendering is left to the caller.
    function restoreTournamentState(raw) {
      const state = copyTournamentState(parseStoredJson(raw, STATE_KEY));
      if (!state) {
        if (raw !== null) {
          console.warn("Ignoring an unusable saved tournament state; starting a fresh setup.");
          backupStoredState(raw);
          removeStoredState();
        }
        return false;
      }
      currentSchedule = state.schedule;
      currentRoundIndex = state.currentRoundIndex;
      tournamentStarted = state.tournamentStarted;
      // A setup that has not started still holds its schedule's own player names
      // (names are assigned at Start), and its module is not loaded again: they
      // are the defaults a blank name input falls back to, whatever the format.
      if (!tournamentStarted) storeDefaultPlayerNames(currentSchedule.players);
      courtNames = state.courtNames;
      tournamentFormat = state.format;
      mexicanoPlayerCount = state.mexicanoPlayerCount;
      mexicanoSeed = state.mexicanoSeed;
      totalPoints = state.totalPoints;
      document.getElementById("tournamentName").value = state.tournamentName;
      document.getElementById("tournamentTitle").textContent = state.tournamentName || "Tournament Title";
      return true;
    }

    // Discard whatever is in memory and show (and store) the setup for a new
    // tournament: the fallback when a restore throws.
    function startFreshSetup() {
      resetSetupChoices();
      resetTournamentState(); // also drops the stored state and loads the default schedule
      document.getElementById("settingsContainer").style.display = "block";
    }

    // Set the setup's own choices back to a fresh setup's defaults, the default
    // schedule chosen: everything but the tournament itself (resetTournamentMemory).
    // Both fresh setups on load use it (nothing usable stored; a restore that
    // threw), so neither keeps a choice made, or restored, before.
    function resetSetupChoices() {
      courtNames = [];
      tournamentFormat = DEFAULT_FORMAT;
      mexicanoPlayerCount = DEFAULT_MEXICANO_PLAYERS;
      totalPoints = DEFAULT_TOTAL_POINTS;
      document.getElementById("tournamentName").value = "";
      document.getElementById("tournamentTitle").textContent = "Tournament Title";
      resetScheduleSelect();
    }

    // Drop the tournament held in memory (see abandonPendingState): not started,
    // no schedule (the caller loads one), round 1, no seed, no typed name drafts
    // (a new setup starts from the default names).
    function resetTournamentMemory() {
      abandonPendingState();
      cancelStandingsRedraw(); // a redraw pending for the dropped tournament
      tournamentStarted = false;
      currentSchedule = null;
      currentRoundIndex = 0;
      mexicanoSeed = null;
      uncheckedTournamentName = null;
      clearPlayerNameDrafts();
    }

    // Point #scheduleSelect back at its default option (the one the markup selects).
    function resetScheduleSelect() {
      const select = document.getElementById("scheduleSelect");
      const option = Array.from(select.options).find(o => o.defaultSelected) || select.options[0];
      select.value = option.value;
    }


    // Copy a raw stored state (the string as stored, unparsed) to STATE_BACKUP_KEY
    // before a fallback on load drops it: when it is unusable, or when restoring it
    // threw. So such a state can still be recovered by hand from the backup, unless
    // it is longer than MAX_BACKUP_LENGTH (logged, not backed up) or the backup
    // write fails (logged); neither blocks the fallback. One generation only: each
    // backup overwrites the last, except that with nothing stored (null) or an
    // empty stored string, which holds nothing to recover, the last backup is kept.
    // Only the stored state is backed up: an unusable saved tournament is skipped
    // and dropped from storage, with no backup, the next time the saved list is
    // written. A reset the Organizer chose (New Tournament, another schedule) is no
    // fallback and backs nothing up.
    function backupStoredState(raw) {
      // DEFERRED: AB#102 (contentless stored state must not overwrite the backup)
      if (raw === null || raw === "") return;
      if (raw.length > MAX_BACKUP_LENGTH) {
        console.warn("Not backing up a stored tournament state longer than " + MAX_BACKUP_LENGTH +
          " characters:", STATE_BACKUP_KEY, raw.length);
        return;
      }
      try {
        localStorage.setItem(STATE_BACKUP_KEY, raw);
      } catch (err) {
        console.warn("Could not back up the stored tournament state:", STATE_BACKUP_KEY, err);
      }
    }

    // The raw stored state, or null when there is none or storage cannot be read
    // (logged; the app then starts as if nothing were stored).
    function readRawStoredState() {
      try {
        return localStorage.getItem(STATE_KEY);
      } catch (err) {
        console.warn("Could not read the stored tournament state:", STATE_KEY, err);
        return null;
      }
    }

    // Remove a localStorage value. A failed removal (storage unavailable) is logged
    // and never aborts the action that triggered it.
    function removeStoredValue(key) {
      try {
        localStorage.removeItem(key);
      } catch (err) {
        console.warn("Could not remove localStorage value:", key, err);
      }
    }

    // Restore tournament state from localStorage.
    window.addEventListener("load", function () {
      // From here on the state may be saved and removed, and controls take
      // effect: this handler runs to its end without yielding, so every write from
      // now on is either the restore's own (re-saving the restored tournament,
      // dropping an unusable state, the fallback) or comes after it.
      initialRestoreBegun = true;
      try {
        // The stored state is read once, here: restoring uses this value, and it
        // is the one backed up if restoring throws (restoring may rewrite the key).
        // While the legacy state's migration is pending (its copy could not be
        // stored), that copy is restored instead.
        const storedState = readRawStoredState();
        const pendingState = pendingMigrationFor(STATE_KEY, storedState);
        try {
          showInitialView(pendingState ? pendingState.raw : storedState);
        } catch (err) {
          // Last line of defence: stored state is validated before use, but whatever
          // slips through must never leave a broken page. The fresh setup drops the
          // stored state, so it is backed up first. Only stored data is backed up: a
          // pending legacy state is not stored. Its migration is dropped instead, so
          // the fresh setup's saves neither mark it migrated nor remove it: the
          // legacy value stays in place, unmigrated, and is tried again by a later
          // load that finds no stored state (the fresh setup, once stored, is newer
          // data until the app removes it).
          // DEFERRED: AB#100 (one restore-failure policy: a legacy value left unmigrated here can resurface over newer data)
          console.error("Could not restore the saved tournament; starting a fresh setup.", err);
          backupStoredState(storedState);
          delete pendingMigrations[STATE_KEY];
          startFreshSetup();
        }
        initialRestoreDone = true;
        // Restored from a pending legacy state: store it now, completing its migration.
        if (pendingMigrations[STATE_KEY]) saveTournamentState();

        // Populate the saved tournament dropdown. Storage that cannot be read must
        // not break the page: the list then stays empty.
        try {
          populateSavedTournamentDropdown();
        } catch (err) {
          console.error("Could not list the saved tournaments.", err);
        }
      } finally {
        releaseControls();
      }
    });

    // storedState: the raw stored tournament state (see restoreTournamentState).
    function showInitialView(storedState) {
      // 1. Restore a saved state; 2. without a usable one, start a fresh setup in
      // memory, whatever the page held before, and load the default schedule.
      if (!restoreTournamentState(storedState)) {
        resetSetupChoices();
        resetTournamentMemory();
        const defaultModule = document.getElementById("scheduleSelect").value;
        loadScheduleFromModule(defaultModule);
      }

      // 3. Ensure currentSchedule is loaded.
      if (!currentSchedule) {
        const defaultModule = document.getElementById("scheduleSelect").value;
        loadScheduleFromModule(defaultModule);
      }

      // 4. Generate the player name table and the court name inputs.
      if (currentSchedule && currentSchedule.players) {
        renderSetupInputs();
      } else {
        console.error("No schedule loaded; please load a schedule first.");
      }

      // 5. Show the setup controls of the active format (restored or the default).
      applyFormatUI();

      // 6. Show either the tournament round (if running) or the settings for new tournament.
      if (tournamentStarted) {
        disableSettings();
        document.getElementById("toggleSettingsBtn").style.display = "block";
        displayRound(currentRoundIndex);
      } else {
        document.getElementById("settingsContainer").style.display = "block";
        document.getElementById("toggleSettingsBtn").style.display = "none";
      }
    }




    // Save current tournament.
    // Returns whether the tournament was stored.
    function saveTournament() {
      if (!currentSchedule) return false;
      const typedName = document.getElementById("tournamentName").value.trim() || "Unnamed Tournament";
      const tournamentName = checkedTournamentName(typedName);
      // DEFERRED: AB#104 (the rename is adopted before the write and stays if the write fails)
      adoptCheckedTournamentName(typedName, tournamentName);
      const savedTournament = {
        tournamentName: tournamentName,
        schedule: currentSchedule,
        currentRoundIndex: currentRoundIndex,
        courtNames: courtNames.slice(),
        format: tournamentFormat,
        mexicanoSeed: mexicanoSeed,
        totalPoints: totalPoints,
        savedAt: new Date().toISOString()
      };
      let savedTournaments = readSavedTournaments();
      const existingIndex = savedTournaments.findIndex(t => t.tournamentName === tournamentName);
      if (existingIndex !== -1) {
        savedTournaments[existingIndex] = savedTournament;
      } else {
        savedTournaments.push(savedTournament);
      }
      const saved = writeAppValue(SAVED_TOURNAMENTS_KEY, savedTournaments);
      populateSavedTournamentDropdown();
      alert(saved ? "Tournament saved!" : "The tournament could not be saved.");
      return saved;
    }

    // Load tournament.
    function loadTournament() {
      let savedTournaments = readSavedTournaments();
      const dropdown = document.getElementById("savedTournamentSelect");
      const selectedIndex = parseInt(dropdown.value, 10);
      if (!isNaN(selectedIndex) && savedTournaments[selectedIndex]) {
        const selectedTournament = savedTournaments[selectedIndex];
        // Drop the replaced tournament's pending redraw before anything else, so a
        // throw before displayRound (which would replace it) cannot leave it alive.
        cancelStandingsRedraw();
        abandonPendingState(); // the loaded tournament replaces the one held
        uncheckedTournamentName = null; // its name is the saved tournament's own
        currentSchedule = selectedTournament.schedule;
        // Tournaments saved before round position was tracked (or with a corrupted
        // index) carry none/an invalid value: fall back to round 0.
        currentRoundIndex = normalizeRoundIndex(selectedTournament.currentRoundIndex, currentSchedule);
        tournamentStarted = true;
        // Tournaments saved before court names existed carry none: use the defaults.
        courtNames = normalizeCourtNames(selectedTournament.courtNames);
        generateCourtNameInputs();
        // Tournaments saved before formats existed carry none: they are Americano.
        tournamentFormat = selectedTournament.format;
        mexicanoSeed = selectedTournament.mexicanoSeed;
        if (tournamentFormat === "mexicano") {
          // The settings show the loaded tournament's players (locked below).
          mexicanoPlayerCount = currentSchedule.players.length;
          generatePlayerInputs(currentSchedule.players);
        }
        // Tournaments saved before the points total was stored carry none: it is
        // inferred from their results (storedTotalPoints).
        totalPoints = selectedTournament.totalPoints;
        applyFormatUI();
        document.getElementById("tournamentName").value = selectedTournament.tournamentName;
        document.getElementById("tournamentTitle").textContent = selectedTournament.tournamentName;
        disableSettings();
        document.getElementById("toggleSettingsBtn").style.display = "block";
        clearNextRoundAnnouncement();
        displayRound(currentRoundIndex);
        saveTournamentState();
      }
    }

    // Delete tournament. The confirmation names the save that will be deleted:
    // the name typed or, for the name that went unchecked at Start, the unique
    // name it is checked to (checkedTournamentName). That rename is applied only
    // once the Organizer confirms, so a cancelled Delete changes nothing.
    // Accepted multi-tab risk (localStorage has no compare-and-set): another tab
    // may save under the checked name while the confirmation is open; that save
    // is then the one deleted.
    function deleteTournament() {
      const typedName = document.getElementById("tournamentName").value.trim();
      if (!typedName) {
        alert("No tournament name provided.");
        return;
      }
      const tournamentName = checkedTournamentName(typedName);
      // DEFERRED: AB#104 (Delete of an unchecked name reports a delete nothing matched; adopting before the reset is a redundant write)
      if (confirm(`Are you sure you want to delete "${tournamentName}"? Your secret sauce will vanish forever!`)) {
        adoptCheckedTournamentName(typedName, tournamentName);
        let savedTournaments = readSavedTournaments();
        savedTournaments = savedTournaments.filter(t => t.tournamentName !== tournamentName);
        writeAppValue(SAVED_TOURNAMENTS_KEY, savedTournaments);
        populateSavedTournamentDropdown();
        resetTournamentState();
        alert(`Tournament "${tournamentName}" deleted!`);
      }
    }

    // Start's name: { name, checked }. name is baseName, or, when a saved
    // tournament already has that name, baseName with the first free "-<n>"
    // suffix (uniqueNameAmong). When storage refuses the saved list's read, with
    // whatever error (a DOMException with blocked site data; a TypeError with
    // storage disabled, where localStorage is null), the name is not checked:
    // name is baseName and checked is false (logged). Start must not fail for it,
    // and nothing is written from it; the tournament starts, its auto-save fails
    // and the auto-save warning shows. Start then keeps the name as
    // uncheckedTournamentName, and Save and Delete check it before they write the
    // saved list (checkedTournamentName), so neither replaces nor deletes an older
    // saved tournament of that name once storage works again. Only the read of
    // storage is caught: an error past it, in the migration lookup or the copy
    // layer (readSavedTournamentsFrom: pendingMigrationFor,
    // copySavedTournamentList), is a bug, no storage refusal, and is thrown: it
    // must never switch the check off. (An unparsable list throws nothing:
    // parseStoredJson logs it and the list reads as empty.)
    // Accepted residual risk: the unchecked name is held in memory only. Once
    // storage works again the auto-save stores that name, so after a reload (or
    // in another tab) before a Save or Delete has checked it, the name is taken
    // for a checked one: Save may then replace, and Delete delete, a saved
    // tournament of that name.
    function getUniqueTournamentName(baseName) {
      let raw;
      // DEFERRED: AB#104 (any error accessing storage counts as a refusal; consider narrowing)
      try {
        raw = localStorage.getItem(SAVED_TOURNAMENTS_KEY);
      } catch (err) {
        console.warn("Could not read the saved tournaments; the tournament name is not checked against them:", err);
        return { name: baseName, checked: false };
      }
      return { name: uniqueNameAmong(baseName, readSavedTournamentsFrom(raw)), checked: true };
    }

    // The name Save or Delete is to write the saved list under, given typedName,
    // the name the name input holds: typedName, unless it is the name that went
    // unchecked at Start (uncheckedTournamentName). That one is checked now, as
    // Start would have: the result is the unique name (uniqueNameAmong), so that
    // neither replaces nor deletes an older saved tournament of the same name.
    // Neither the app's tournament state nor the saved list is changed here: the
    // action applies the result once it goes ahead (adoptCheckedTournamentName),
    // so an action the Organizer cancels leaves both as they were. (The list's
    // read, as every list read does, may drop a stale pending saved-list
    // migration once the key holds a value: pendingMigrationFor.) Storage that
    // still refuses the saved list throws here, as the list's read in Save and
    // Delete would, and the name stays unchecked.
    // DEFERRED: AB#104 (Save and Delete read the saved list twice: here and for their write)
    function checkedTournamentName(typedName) {
      if (typedName !== uncheckedTournamentName) return typedName;
      return uniqueNameAmong(typedName, readSavedTournaments());
    }

    // Apply checkedTournamentName(typedName), checkedName, as the action goes
    // ahead: the unchecked name is checked from now on, and the tournament is
    // renamed to the unique name (the name input, the title and the stored state).
    function adoptCheckedTournamentName(typedName, checkedName) {
      if (typedName !== uncheckedTournamentName) return;
      uncheckedTournamentName = null;
      if (checkedName !== typedName) {
        document.getElementById("tournamentName").value = checkedName;
        document.getElementById("tournamentTitle").textContent = checkedName;
        saveTournamentState();
      }
    }

    // baseName, or, when one of savedTournaments already has that name, baseName
    // with the first free "-<n>" suffix.
    function uniqueNameAmong(baseName, savedTournaments) {
      let usedNames = new Set(savedTournaments.map(t => t.tournamentName));
      if (!usedNames.has(baseName)) return baseName;

      let i = 1;
      let newName = `${baseName}-${i}`;
      while (usedNames.has(newName)) {
        i++;
        newName = `${baseName}-${i}`;
      }
      return newName;
    }



    document.getElementById("startTournamentBtn").addEventListener("click", function () {
      // Start is disabled while a tournament runs; a re-enabled button (as with
      // devtools) must not replace the running tournament and its locked rounds.
      if (tournamentStarted) return;

      // Get and trim tournament name.
      let tournamentName = document.getElementById("tournamentName").value.trim();
      if (!tournamentName) {
        alert("Tournament name must not be empty.");
        console.log("Start tournament aborted: name is empty.");
        return; // Exit function if name is empty.
      }

      // Generate unique tournament name and update input.
      const startName = getUniqueTournamentName(tournamentName);
      // DEFERRED: AB#103 (aborted Start leaves a renamed name input)
      document.getElementById("tournamentName").value = startName.name;

      if (tournamentFormat === "mexicano") {
        if (!startMexicano()) return;
      } else {
        if (!currentSchedule) {
          alert("Please load a schedule first.");
          return;
        }

        if (!randomizePlayers()) return;
      }

      // Now proceed to start the tournament.
      tournamentStarted = true;
      uncheckedTournamentName = startName.checked ? null : startName.name;
      currentRoundIndex = 0;
      disableSettings();
      document.getElementById("settingsContainer").style.display = "none";
      document.getElementById("toggleSettingsBtn").style.display = "block";
      displayRound(currentRoundIndex);
      saveTournamentState();
    });

    // New tournament.
    function newTournament() {
      if (confirm("Do you want to save the current tournament before creating a new one?")) {
        // The Organizer asked to keep it: if it could not be stored, do not discard it.
        if (!saveTournament()) {
          alert("The current tournament was kept, because it could not be saved.");
          return;
        }
      }
      // Clear the name first: resetTournamentState saves the new, empty setup.
      document.getElementById("tournamentName").value = "";
      document.getElementById("tournamentTitle").textContent = "Tournament Title";
      resetTournamentState();
      document.getElementById("settingsContainer").style.display = "block";
      alert("Ready for a new tournament!");
    }


    function resetTournamentState() {
      resetTournamentMemory(); // the new setup replaces the tournament held
      document.getElementById("formatSelect").disabled = false;
      document.getElementById("playerCountSelect").disabled = false;
      document.getElementById("scheduleSelect").disabled = false;
      document.getElementById("globalTotalPoints").disabled = false;
      document.getElementById("tournamentName").disabled = false;
      const inputs = document.querySelectorAll("#playerInputsContainer input, #playerInputsContainer textarea");
      inputs.forEach(input => input.disabled = false);
      document.getElementById("startTournamentBtn").disabled = false;
      document.getElementById("toggleSettingsBtn").style.display = "none";
      removeStoredState();
      loadScheduleFromModule(document.getElementById("scheduleSelect").value);
      renderSetupInputs(); // the chosen format is kept, with its player count
      applyFormatUI();
      saveTournamentState(); // persist the kept format now, not only on unload
    }

    function populateSavedTournamentDropdown() {
      const dropdown = document.getElementById("savedTournamentSelect");
      let savedTournaments = readSavedTournaments();
      dropdown.innerHTML = "";
      savedTournaments.forEach((tournament, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = tournament.tournamentName + " (Saved: " + formatSavedAt(tournament.savedAt) + ")";
        dropdown.appendChild(option);
      });
      if (currentSchedule && document.getElementById("tournamentName").value) {
        const currentName = document.getElementById("tournamentName").value.trim();
        const selectedIndex = savedTournaments.findIndex(t => t.tournamentName === currentName);
        if (selectedIndex !== -1) dropdown.value = selectedIndex;
      }
    }

    // --- Helper Functions (no duplicates) ---
    function storeDefaultPlayerNames(players) {
      defaultPlayerNames = players.slice();
    }

    function generatePlayerInputs(players) {
      const container = document.getElementById("playerInputsContainer");
      container.innerHTML = ""; // Clear previous content

      // Create the table container
      const table = document.createElement("div");
      table.className = "player-names-table";

      players.forEach((player, index) => {
        const input = document.createElement("input");
        input.type = "text";
        input.value = player;
        input.maxLength = 30; // Ensures a max of 30 characters
        input.id = "playerInput_" + index;
        input.placeholder = "Enter name";

        table.appendChild(input); // Add each input directly to the table grid
      });

      container.appendChild(table); // Append table to the container
    }

    // --- Persisted-state validation ---
    // localStorage is shared by every page on this origin, including the other
    // GitHub Pages projects served from it, so everything read back is untrusted:
    // it is parsed defensively, shape-checked, and REBUILT from only the checked
    // fields, so nothing unchecked (extra properties, deep nesting) ever reaches the
    // app or is written back by it. A schedule whose structure is unusable is
    // rejected whole (a stored tournament state then falls back to a fresh setup; a
    // saved tournament is skipped); fields that can be repaired (round index,
    // names) are reset to their defaults, and an overlong string is cut to its
    // limit (clampStoredString, clampTournamentName). Scores are the exception:
    // they are type-checked, not repaired. A stored pair of strings is kept as
    // stored (an overlong side only cut to the limit, which the score rule then
    // never credits), even one that breaks the score rule (see parseScore), which
    // then only shows its error and is not credited; if either side is not a
    // string, the whole result is no result.
    // The checks are never stricter than what the app itself writes, and no cut
    // ever applies to what it writes (see MAX_STORED_STRING_LENGTH), so the app's
    // own data always survives a reload unchanged.

    function isPlainObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    // The parsed value of a raw stored string read from key, or null when it is
    // null (nothing stored) or unparsable.
    function parseStoredJson(raw, key) {
      if (raw === null) return null;
      try {
        return JSON.parse(raw);
      } catch (err) {
        console.warn("Ignoring unparsable localStorage value:", key);
        return null;
      }
    }

    // Player names are rendered as text only, so any string the name inputs can
    // produce is acceptable; it just has to be a non-blank string of bounded length.
    function isValidPlayerName(name) {
      return typeof name === "string" && name.length <= MAX_PLAYER_NAME_LENGTH && name.trim() !== "";
    }

    // A stored string cut to MAX_STORED_STRING_LENGTH: an overlong one is repaired,
    // not dropped. The cut never splits a surrogate pair (a character outside the
    // Basic Multilingual Plane, such as an emoji): it then keeps one character
    // fewer. Not for scores: see clampStoredScore.
    function clampStoredString(value) {
      if (value.length <= MAX_STORED_STRING_LENGTH) return value;
      const last = value.charCodeAt(MAX_STORED_STRING_LENGTH - 1);
      const isHighSurrogate = last >= 0xD800 && last <= 0xDBFF;
      return value.slice(0, isHighSurrogate ? MAX_STORED_STRING_LENGTH - 1 : MAX_STORED_STRING_LENGTH);
    }

    // A stored tournament name: one within the limit is kept as stored; an overlong
    // one (only crafted data: the app writes at most about 200 characters) is
    // trimmed, cut to the limit and trimmed again at the cut. So the repaired name
    // is blank only when the stored one is, and it has no leading or trailing
    // whitespace, which Save, Delete and the saved-list selection trim from the
    // name input before matching it against saved names.
    function clampTournamentName(name) {
      if (name.length <= MAX_STORED_STRING_LENGTH) return name;
      return clampStoredString(name.trim()).trimEnd();
    }

    // Tournament names are rendered as text only; anything but a string means "no name".
    function normalizeTournamentName(name) {
      return typeof name === "string" ? clampTournamentName(name) : "";
    }

    // Only a known format is kept; anything else (state saved before formats existed,
    // hostile values) means Americano, the format every older tournament was played in.
    function normalizeFormat(format) {
      return typeof format === "string" && FORMATS.includes(format) ? format : DEFAULT_FORMAT;
    }

    // The Mexicano player count is an integer in the range the setup offers, else the default.
    function normalizeMexicanoPlayerCount(count) {
      return Number.isInteger(count) && count >= MIN_MEXICANO_PLAYERS && count <= MAX_MEXICANO_PLAYERS
        ? count : DEFAULT_MEXICANO_PLAYERS;
    }

    // Only one of the offered point pools is kept, as the number the app writes;
    // anything else (a hostile or malformed stored value) means 24, the default.
    // A record with no stored total at all is legacy: see storedTotalPoints.
    function normalizeTotalPoints(total) {
      return Number.isInteger(total) && POINT_POOLS.includes(total) ? total : DEFAULT_TOTAL_POINTS;
    }

    // The points total of a stored tournament state or saved tournament. A stored
    // total (even an invalid one) is normalized, never inferred over. A legacy
    // record, saved before the total was stored (no totalPoints key at all), has
    // it inferred from its results (inferLegacyTotal). Either way the results
    // themselves are kept as stored, an overlong side only cut (copyResult): the
    // total only decides which of them the score rule credits.
    function storedTotalPoints(record) {
      if (Object.prototype.hasOwnProperty.call(record, "totalPoints")) return normalizeTotalPoints(record.totalPoints);
      return inferLegacyTotal(record.schedule);
    }

    // A legacy record's total: among its complete stored pairs (both sides plain
    // digits the score rule can read, see isScoreDigits), the most common sum that
    // is a pool; on a tie, the pool of the earliest such pair in round order; with
    // none, 24.
    function inferLegacyTotal(schedule) {
      const counts = new Map(); // insertion order: first appearance in round order
      const rounds = isPlainObject(schedule) && Array.isArray(schedule.rounds) ? schedule.rounds : [];
      rounds.forEach(round => {
        if (!isPlainObject(round) || !Array.isArray(round.matches)) return;
        round.matches.forEach(match => {
          const result = isPlainObject(match) ? match.result : null;
          if (!isPlainObject(result) || typeof result.left !== "string" || typeof result.right !== "string") return;
          if (!isScoreDigits(result.left) || !isScoreDigits(result.right)) return;
          const sum = Number(result.left) + Number(result.right);
          if (POINT_POOLS.includes(sum)) counts.set(sum, (counts.get(sum) || 0) + 1);
        });
      });
      let total = DEFAULT_TOTAL_POINTS;
      let best = 0;
      counts.forEach((count, sum) => {
        if (count > best) { total = sum; best = count; }
      });
      return total;
    }

    // Two teams of two, each entry an integer index into the player list.
    // Returns a copy, or null when the shape is wrong.
    function copyTeamIndices(teamIndices, playerCount) {
      const valid = Array.isArray(teamIndices) && teamIndices.length === 2 && teamIndices.every(team =>
        Array.isArray(team) && team.length === 2 &&
        team.every(i => Number.isInteger(i) && i >= 0 && i < playerCount));
      return valid ? teamIndices.map(team => team.slice()) : null;
    }

    // A score's form: plain digits (no sign, fraction, exponent or spaces),
    // shorter than MAX_STORED_STRING_LENGTH. So a score never reaches the length at
    // which a stored score is cut (clampStoredScore): a cut one is never a score,
    // and cutting can neither turn an invalid score into a credited one ("0...0120"
    // into "0...012") nor change a valid one. Zero-padding below the limit is
    // accepted, as a number input takes it.
    function isScoreDigits(value) {
      return typeof value === "string" && value.length < MAX_STORED_STRING_LENGTH && /^\d+$/.test(value);
    }

    // The one score rule: a score is a whole number from 0 to the points total,
    // written as plain digits (isScoreDigits). Returns it, or null for anything
    // else, including no entry (""). Shared by score entry, its validation, the
    // "round complete" check, the scoreboard and the error a stored result shows:
    // it decides credit, display and gating. An entry it rejects is shown with
    // its error and recorded as no score (recordedResult). Restore never rewrites
    // a result by it (see copyResult).
    function parseScore(value, total) {
      if (!isScoreDigits(value)) return null;
      const score = Number(value);
      return score <= total ? score : null;
    }

    // A complete, valid result: two scores (see parseScore) that sum to the total.
    function isCompleteResult(result, total) {
      if (!result) return false;
      const left = parseScore(result.left, total);
      const right = parseScore(result.right, total);
      return left !== null && right !== null && left + right === total;
    }

    // The result score entry records for the entered scores: as entered when
    // complete and valid, otherwise "no score yet" (both ""). So the app never
    // writes a result that breaks the score rule; it only keeps stored ones.
    function recordedResult(left, right, total) {
      const result = { left: left, right: right };
      return isCompleteResult(result, total) ? result : { left: "", right: "" };
    }

    // Scores are the raw values of the score inputs: strings ("" when not entered).
    // They are type-checked, not repaired: a pair of strings is kept as stored
    // (an overlong side only cut, see clampStoredScore), even one that breaks the
    // score rule (it may be a result played under another total). Such a pair
    // shows its error, is not credited and counts as missing until the Organizer
    // edits it. A result of another type means "no result recorded".
    function copyResult(result) {
      if (!isPlainObject(result) || typeof result.left !== "string" || typeof result.right !== "string") return null;
      return { left: clampStoredScore(result.left), right: clampStoredScore(result.right) };
    }

    // A stored score cut to exactly MAX_STORED_STRING_LENGTH, which keeps storage
    // bounded. A cut score is by construction never creditable: the score rule
    // rejects that length (isScoreDigits). Unlike clampStoredString it cuts even
    // inside a surrogate pair, so a cut score always has exactly that length: one
    // character fewer could leave plain digits behind ("0...012" then an emoji),
    // which the rule would credit. A score holding a surrogate is never digits.
    function clampStoredScore(value) {
      return value.slice(0, MAX_STORED_STRING_LENGTH);
    }

    // A rebuilt match, or null when its structure is unusable.
    function copyMatch(match, players, courtCount, requireTeamIndices) {
      if (!isPlainObject(match)) return null;
      // The court number becomes a CSS class and a data attribute: an in-range integer only.
      if (!Number.isInteger(match.court) || match.court < 1 || match.court > courtCount) return null;
      if (!Array.isArray(match.teams) || match.teams.length !== 2) return null;
      const teamsValid = match.teams.every(team =>
        Array.isArray(team) && team.length === 2 &&
        team.every(player => typeof player === "string" && players.has(player)));
      if (!teamsValid) return null;
      const copy = {
        court: match.court,
        teams: match.teams.map(team => team.slice()),
        result: copyResult(match.result)
      };
      // teamIndices maps players to schedule slots when names are assigned at start:
      // a tournament that has not started yet cannot do without it; a started one
      // never uses it again, so a bad one is simply dropped.
      const teamIndices = copyTeamIndices(match.teamIndices, players.size);
      if (teamIndices) copy.teamIndices = teamIndices;
      else if (requireTeamIndices) return null;
      return copy;
    }

    // A copy of the schedule holding only the fields the rounds, scoreboard and start
    // flow read, each of the right type and in range; null when it is unusable.
    // Byes (who rests) are never read from storage: they are rebuilt from the
    // checked matches (setByes), so they always name exactly the unseated players.
    // Results are type-checked only and kept as stored, an overlong side only cut
    // (copyResult).
    function copySchedule(schedule, requireTeamIndices) {
      if (!isPlainObject(schedule)) return null;
      const playerList = schedule.players;
      // At least one full court; with a count that is not a multiple of four the
      // players left over rest each round.
      if (!Array.isArray(playerList) || playerList.length < 4 || playerList.length > MAX_PLAYERS) return null;
      if (!playerList.every(isValidPlayerName)) return null;
      const players = new Set(playerList);
      if (players.size !== playerList.length) return null; // names must be unique
      const courtCount = Math.floor(playerList.length / 4);
      const rounds = schedule.rounds;
      if (!Array.isArray(rounds) || rounds.length < 1 || rounds.length > MAX_ROUNDS) return null;
      const roundCopies = [];
      for (const round of rounds) {
        if (!isPlainObject(round) || !Number.isInteger(round.roundNumber) ||
          round.roundNumber < 1 || round.roundNumber > MAX_ROUNDS) return null;
        if (!Array.isArray(round.matches) || round.matches.length < 1 || round.matches.length > courtCount) return null;
        const matchCopies = round.matches.map(match => copyMatch(match, players, courtCount, requireTeamIndices));
        if (matchCopies.includes(null)) return null;
        roundCopies.push({ roundNumber: round.roundNumber, matches: matchCopies });
      }
      return setByes({ players: playerList.slice(), rounds: roundCopies });
    }

    // The players a round seats on no court, in player-list order: who rests.
    function restingPlayers(players, matches) {
      const seated = new Set();
      matches.forEach(match => match.teams.forEach(team => team.forEach(player => seated.add(player))));
      return players.filter(player => !seated.has(player));
    }

    // Set each round's byes from its matches, as the shipped tables carry them:
    // only a player count that is not a multiple of four has byes. Called
    // wherever a schedule is loaded, restored or renamed. Returns the schedule.
    function setByes(schedule) {
      const withByes = schedule.players.length % 4 !== 0;
      schedule.rounds.forEach(round => {
        if (withByes) round.byes = restingPlayers(schedule.players, round.matches);
        else delete round.byes;
      });
      return schedule;

    // The seed of a Mexicano round-1 draw: an unsigned 32-bit integer, as the app draws it.
    function isValidMexicanoSeed(seed) {
      return Number.isInteger(seed) && seed >= 0 && seed <= MAX_MEXICANO_SEED;
    }

    // A copy of a started Mexicano tournament's schedule, or null when it is unusable.
    // On top of copySchedule's checks it must be structurally sound, the shape the
    // next round can be generated from: a player count Mexicano pairs (8-24), rounds
    // numbered 1, 2, 3, ... in order, and in every round each court used exactly once
    // and each player seated at most once (the rest are its byes). This is a shape
    // check only: it does not prove the app generated these rounds.
    function copyMexicanoSchedule(schedule) {
      const copy = copySchedule(schedule, false);
      if (!copy) return null;
      const playerCount = copy.players.length;
      if (playerCount < MIN_MEXICANO_PLAYERS || playerCount > MAX_MEXICANO_PLAYERS) return null;
      const courtCount = Math.floor(playerCount / 4);
      const sound = copy.rounds.every((round, index) => {
        if (round.roundNumber !== index + 1 || round.matches.length !== courtCount) return false;
        const courts = new Set(round.matches.map(match => match.court));
        const seated = new Set(round.matches.flatMap(match => match.teams.flat()));
        return courts.size === courtCount && seated.size === courtCount * 4;

      return sound ? copy : null;

    // or null when they are unusable. A Mexicano tournament needs a structurally sound
    // Mexicano schedule and a well-formed seed for its round-1 draw (the app writes
    // both at Start); without them it is not used to generate further rounds. The
    // seed is shape-checked only: it is not authenticated, and round 1 is not
    // re-derived from it.
    function copyStartedPlay(format, schedule, seed) {
      if (format !== "mexicano") {

        return copy ? { schedule: copy, mexicanoSeed: null } : null;

      if (!isValidMexicanoSeed(seed)) return null;
      const copy = copyMexicanoSchedule(schedule);
      return copy ? { schedule: copy, mexicanoSeed: seed } : null;
    }

    // A rebuilt copy of a parsed tournament state, or null when it is unusable.
    function copyTournamentState(state) {
      if (!isPlainObject(state)) return null;
      const started = state.tournamentStarted === true;
      const format = normalizeFormat(state.format);
      // A setup that has not started holds the Americano schedule (whatever the
      // format) and no seed: the seed is drawn at Start.
      const play = started
        ? copyStartedPlay(format, state.schedule, state.mexicanoSeed)
        : { schedule: copySchedule(state.schedule, true), mexicanoSeed: null };
      if (!play || !play.schedule) return null;
      const schedule = play.schedule;
      return {
        schedule: schedule,
        currentRoundIndex: normalizeRoundIndex(state.currentRoundIndex, schedule),
        tournamentStarted: started,
        tournamentName: normalizeTournamentName(state.tournamentName),
        courtNames: normalizeCourtNames(state.courtNames),
        format: format,
        // A running Mexicano tournament's count is its players'; a setup's is the chosen one.
        mexicanoPlayerCount: started && format === "mexicano"
          ? schedule.players.length : normalizeMexicanoPlayerCount(state.mexicanoPlayerCount),
        mexicanoSeed: play.mexicanoSeed,
        totalPoints: storedTotalPoints(state)

    // A rebuilt saved tournament, or null when it has no usable name (the save's
    // key: a blank one is unusable) or schedule. An overlong name is repaired
    // (clampTournamentName), and is never blank when the stored one is not. Two
    // overlong names that agree in their first 1000 characters (after trimming)
    // become the same name: both are listed and load, but Save replaces the first
    // of them and Delete removes both. Accepted, as only crafted data holds such
    // a name (the name input takes 200 characters).
    // Loaded tournaments are always started, so teamIndices is not required.
    function copySavedTournament(entry) {
      if (!isPlainObject(entry) || typeof entry.tournamentName !== "string" || entry.tournamentName.trim() === "") return null;
      const tournamentName = clampTournamentName(entry.tournamentName);
      const format = normalizeFormat(entry.format); // saved tournaments are always started
      const play = copyStartedPlay(format, entry.schedule, entry.mexicanoSeed);
      if (!play) return null;
      const schedule = play.schedule;
      const copy = {
        tournamentName: tournamentName,
        schedule: schedule,
        currentRoundIndex: normalizeRoundIndex(entry.currentRoundIndex, schedule),
        courtNames: normalizeCourtNames(entry.courtNames),
        format: format,
        mexicanoSeed: play.mexicanoSeed,

        // entry keeps its inferred total (and, like every entry, its results).
        totalPoints: storedTotalPoints(entry)

    // the list, so the next list written keeps it. Reading storage that throws

    // which reads the stored state once, readRawStoredState, turns an unreadable
    // value into "nothing stored", and Start's name check, which writes nothing

    // getUniqueTournamentName.)

    function readSavedTournaments() {

    // of side effects: pendingMigrationFor may drop a stale pending saved-list
    // migration (when raw holds a value).
    function readSavedTournamentsFrom(raw) {
      const migration = pendingMigrationFor(SAVED_TOURNAMENTS_KEY, raw);
      return copySavedTournamentList(migration ? migration.raw : raw);
    }

    // The usable saved tournaments of a raw saved list, rebuilt (see readSavedTournaments).
    function copySavedTournamentList(raw) {
      const saved = parseStoredJson(raw, SAVED_TOURNAMENTS_KEY);
      if (!Array.isArray(saved)) return [];
      return saved.map(copySavedTournament).filter(entry => entry !== null);
    }

    // --- Legacy storage migration ---
    // Before its keys were prefixed, the app stored its data under the generic
    // LEGACY_* keys, which another page on this origin may use as well. Whatever
    // is under them may be another page's data, so it is never deleted unless all
    // of it was carried over.
    // migrateLegacyStorage runs at the top of the app script on every load, before
    // any handler can write a prefixed key. For each legacy key, independently:
    // - nothing happens once the key's migrated marker exists (it was migrated
    //   before), while the prefixed key exists (newer data), or when the legacy
    //   key is absent;
    // - the legacy value goes through the copy layer above, so nothing unchecked
    //   is carried over. With nothing usable (unparsable, not the app's data, or
    //   an empty saved list: nothing to migrate) nothing is written (no marker
    //   either) and the legacy key is left in place;
    // - otherwise the usable copy is stored under the prefixed key together with
    //   the key's migrated marker (writeMigratedValue): the marker first, and the
    //   copy only once the marker is stored. So a copy never stands without its
    //   marker, which would let the legacy value be migrated again, over later
    //   data, whenever the app removes the prefixed key (choosing a schedule, or
    //   dropping an unusable stored state, removes the stored state) and the page
    //   is closed before its next save;
    // - if either write fails, it is logged as an error, the marker is taken back
    //   off and the legacy key is left in place. The migration is then pending
    //   (pendingMigrations): the app reads the copy as the prefixed key's stored
    //   value (the state restored on load, once that restore has succeeded; the
    //   saved list offered and written), and its first write of that key that
    //   works stores it with the marker: the migration is done. So no later write
    //   of the app's leaves the legacy value behind unmigrated. Until then (a page
    //   closed with every such write failing) the next load migrates again. A
    //   pending state whose restore throws is dropped from pendingMigrations
    //   unmigrated (see the load handler);
    // - once migrated, the legacy value is never migrated again (the marker);
    // - the legacy key is removed (retireLegacyValue) only once its data is
    //   stored and the value is exactly what was migrated: the value written still
    //   holds the legacy data (the app has not dropped the legacy state for a new
    //   setup, another schedule, a loaded tournament or a Mexicano start:
    //   abandonPendingState; the saved list keeps every
    //   legacy save unchanged), the copy is lossless (isLosslessCopy), and the
    //   legacy key still holds what was read (another page may have written it
    //   since). Otherwise, as when a copy repaired, dropped or left out anything (a
    //   reset round index, an extra field, a skipped saved tournament), the legacy
    //   value is left in place indefinitely, never read again (the marker). That
    //   stale copy is the accepted price of never deleting data that is not stored.
    // The markers came with the prefixed keys, before any release. Earlier builds
    // wrote the marker after the copy, so a marker write that failed there (only
    // with full storage) left a copy without its marker: that legacy value can
    // still be migrated again whenever the prefixed key is absent at load.
    // An error while migrating one key is logged as an error and leaves that
    // legacy key in place; it stops neither the other key's migration nor the app.
    function migrateLegacyStorage() {
      migrateLegacyKey(LEGACY_STATE_KEY, STATE_KEY, STATE_MIGRATED_KEY, copyTournamentState);
      migrateLegacyKey(LEGACY_SAVED_TOURNAMENTS_KEY, SAVED_TOURNAMENTS_KEY, SAVED_TOURNAMENTS_MIGRATED_KEY,
        copyLegacySavedTournaments);
    }

    // copyLegacy(parsed) returns the copy to store under newKey, or null when
    // there is nothing usable to migrate. migratedKey records a done migration.
    function migrateLegacyKey(legacyKey, newKey, migratedKey, copyLegacy) {
      try {
        if (localStorage.getItem(migratedKey) !== null) return;
        if (localStorage.getItem(newKey) !== null) return;
        const legacyRaw = localStorage.getItem(legacyKey);
        if (legacyRaw === null) return;
        const legacy = parseStoredJson(legacyRaw, legacyKey);
        const copy = copyLegacy(legacy);
        if (copy === null) {

          return;

        const migration = {
          legacyKey, legacyRaw, migratedKey, raw: JSON.stringify(copy), lossless: isLosslessCopy(legacy, copy)
        };
        if (!writeMigratedValue(newKey, copy, migration, true)) {
          console.error("Could not write the migrated copy of a legacy localStorage value; leaving it in place:", legacyKey);
          pendingMigrations[newKey] = migration;

    // entries is a saved tournament (not the app's data).
    function copyLegacySavedTournaments(saved) {
      if (!Array.isArray(saved) || saved.length === 0) return null;
      const copies = saved.map(copySavedTournament).filter(entry => entry !== null);
      return copies.length > 0 ? copies : null;
    }

    // round trip), is structurally identical to the parsed legacy value. The same
    // arrays, the same object keys (in any order), the same primitive values; any
    // repaired, dropped or extra field makes it not lossless.
    function isLosslessCopy(legacy, copy) {
      return sameJsonValue(legacy, JSON.parse(JSON.stringify(copy)));

    // nested legacy value fails a key or length check and is never walked.
    function sameJsonValue(original, copy) {
      if (copy === null || typeof copy !== "object") return original === copy;
      if (Array.isArray(copy)) {
        return Array.isArray(original) && original.length === copy.length &&
          copy.every((item, index) => sameJsonValue(original[index], item));

      if (!isPlainObject(original)) return false;
      const keys = Object.keys(copy);
      return Object.keys(original).length === keys.length && keys.every(key =>

    }

    function formatSavedAt(savedAt) {
      if (typeof savedAt !== "string") return "unknown";
      const date = new Date(savedAt);
      return isNaN(date.getTime()) ? "unknown" : date.toLocaleString();
    }

    // --- Court Names ---

    // legacy saves, hostile values) means "use the default".
    function normalizeCourtNames(names) {
      if (!Array.isArray(names)) return [];
